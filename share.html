<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, indexifembedded">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章分享卡</title>
<!--
  11/27 樣本（查查：老闆看到文章會轉給主管或助理；Kolable 的分享字太小）。
  用法：share.html?u=<文章網址>&t=<文章標題>
  分享出去的網址自動加 utm_source=share&utm_medium=<平台>&utm_campaign=post_share，GA4 看得到被轉傳進來的人。
  不幫讀者寫訊息：只帶標題＋連結，讓他自己說要轉給誰、為什麼。
  iframe 需加 allow="clipboard-write; web-share" 才能複製連結、叫出手機分享選單。
-->
<style>
:root{--ink:#1d1d1f;--sub:#5a5a63;--line:#e4e4ea;--bg:#ffffff;--soft:#f5f6fa;--blue:#1F4BFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.card{border:1px solid var(--line);border-radius:16px;padding:22px 20px;background:var(--soft);max-width:720px;margin:0 auto}
h2{font-size:20px;line-height:1.4;font-weight:700;text-wrap:balance}
p.lead{font-size:16px;color:var(--sub);margin-top:6px;line-height:1.6}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media(min-width:620px){.row{grid-template-columns:repeat(6,1fr)}}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--ink)}
.btn svg{width:28px;height:28px}
.btn.more{display:none}
.toast{font-size:14px;color:var(--blue);margin-top:10px;min-height:20px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2>覺得有用？轉給需要的人</h2>
  <p class="lead">傳給主管、同事，或分享到你的社群。</p>
  <div class="row">
    <a class="btn" id="line" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#06C755"/><path fill="#fff" d="M12 5.5c-4.1 0-7.4 2.6-7.4 5.9 0 2.9 2.6 5.4 6.2 5.8.2.1.6.2.7.4.1.2 0 .6 0 .8l-.1.7c0 .2-.2.8.7.4.9-.4 4.9-2.9 6.7-4.9 1.2-1.3 1.8-2.6 1.8-4.1 0-3.4-3.3-6-7.4-6z"/></svg>LINE</a>
    <a class="btn" id="fb" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#1877F2"/><path fill="#fff" d="M13.3 19v-6h2l.3-2.4h-2.3V9.1c0-.7.2-1.1 1.2-1.1h1.2V5.9c-.2 0-.9-.1-1.8-.1-1.8 0-3 1.1-3 3.1v1.8h-2V13h2v6h2.4z"/></svg>Facebook</a>
    <a class="btn" id="threads" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path fill="none" stroke="#fff" stroke-width="1.6" d="M15.6 11.3c-.4-2-1.8-3-3.7-3-2 0-3.3 1.2-3.6 2.8M15.6 11.3c1.9.7 2.6 2.4 2.1 4-.6 2-2.7 3.2-5.6 3.2-3.8 0-6.1-2.6-6.1-6.5S8.3 5.5 12.1 5.5c2.6 0 4.5 1.1 5.4 3.2M15.6 11.3c-2.5-.5-5.5-.2-5.5 1.8 0 1.2 1.1 1.9 2.4 1.8 1.9-.1 3.1-1.4 3.1-3.6z"/></svg>Threads</a>
    <a class="btn" id="li" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#0A66C2"/><path fill="#fff" d="M7.2 9.6h2.2V17H7.2zM8.3 6.2a1.3 1.3 0 110 2.6 1.3 1.3 0 010-2.6zM10.8 9.6h2.1v1c.3-.6 1-1.2 2.2-1.2 2.3 0 2.7 1.5 2.7 3.5V17h-2.2v-3.6c0-.9 0-2-1.2-2s-1.4.9-1.4 1.9V17h-2.2z"/></svg>LinkedIn</a>
    <a class="btn" id="mail" target="_top">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M4 7l8 6 8-6"/></svg>Email</a>
    <button class="btn" id="copy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 011-1h9"/></svg>複製連結</button>
    <button class="btn more" id="more" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>更多</button>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var base=q.get('u')||document.referrer||'https://www.designthinking.com.tw/';
  var title=q.get('t')||'';
  function tag(m){try{var x=new URL(base);x.searchParams.set('utm_source','share');x.searchParams.set('utm_medium',m);x.searchParams.set('utm_campaign','post_share');return x.toString()}catch(e){return base}}
  function enc(s){return encodeURIComponent(s)}
  function txt(m){return (title?title+'\n':'')+tag(m)}
  document.getElementById('line').href='https://social-plugins.line.me/lineit/share?url='+enc(tag('line'));
  document.getElementById('fb').href='https://www.facebook.com/sharer/sharer.php?u='+enc(tag('facebook'));
  document.getElementById('threads').href='https://www.threads.net/intent/post?text='+enc(txt('threads'));
  document.getElementById('li').href='https://www.linkedin.com/sharing/share-offsite/?url='+enc(tag('linkedin'));
  document.getElementById('mail').href='mailto:?subject='+enc(title||'推薦一篇文章')+'&body='+enc(tag('email'));
  var toast=document.getElementById('toast');
  function say(s){toast.textContent=s;setTimeout(function(){toast.textContent=''},2500)}
  document.getElementById('copy').onclick=function(){
    var u=tag('copy');
    if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){say('已複製，可以貼給同事了')},function(){prompt('複製這個連結',u)})}
    else{prompt('複製這個連結',u)}
  };
  var more=document.getElementById('more');
  if(navigator.share){more.style.display='flex';more.onclick=function(){navigator.share({title:title,url:tag('native')}).catch(function(){})}}
})();
</script>
</body>
</html>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  .kcard { --line: #1F4BFF; --q: #14213D; --t: #475069; --muted: #5F6886; --link: #1F4BFF;
    box-sizing: border-box; width: 100%; margin: 10px 0; padding: 2px 6px 2px 18px; border-left: 3px solid var(--line);
    font-family: Roboto, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage.kcard { display: block; height: auto; overflow: visible; background: transparent; color: inherit; }
  .kcard p { margin: 0; }
  .kcard .kl { font-family: Inter, "Noto Sans TC", sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .kcard .kq { font-size: 18px; line-height: 1.55; font-weight: 700; color: var(--q); margin-bottom: 6px; text-wrap: pretty; overflow-wrap: anywhere; }
  .kcard .kt { font-size: 15.5px; line-height: 1.75; color: var(--t); margin-bottom: 10px; text-wrap: pretty; overflow-wrap: anywhere; }
  .kcard .kr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .kcard .ka { font-size: 15.5px; font-weight: 600; color: var(--link); text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
  .kcard .ka .ar { display: inline-block; transition: transform .2s ease; }
  .kcard .ka:hover .ar, .kcard .ka:focus-visible .ar { transform: translateX(3px); }
  .kcard .ka:focus-visible, .kcard .ka2:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  .kcard .ka2 { font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  html.dark .kcard { --q: #eceef1; --t: #b7bbc2; --muted: #8f949c; --link: #8FA8FF; }
  @media (max-width: 420px) {
    .kcard { padding-left: 14px; }
    .kcard .kq { font-size: 16.5px; line-height: 1.55; }
    .kcard .kt { font-size: 14.5px; line-height: 1.7; margin-bottom: 8px; }
    .kcard .ka { font-size: 15px; }
  }
  /* 11/04 查查：「改顏色、設計，比較有變化，一樣的東西看久會煩」→ 4 種版型＋7 種顏色輪流（同一人不會連續看到同版型或同色） */
  #stage.kcard.sk-tint { background: color-mix(in srgb, var(--line) 8%, #fff); }
  #stage.kcard.sk-band { overflow: hidden; }
  html.dark #stage.kcard.sk-tint { background: color-mix(in srgb, var(--line) 20%, #16181b); }
  .kcard.sk-tint { border-left: 0; padding: 18px 20px; border-radius: 14px; background: color-mix(in srgb, var(--line) 8%, #fff); }
  .kcard.sk-tint .kl { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--line); color: #fff; letter-spacing: .03em; margin-bottom: 10px; }
  .kcard.sk-tint .ka, .kcard.sk-band .ka { display: inline-block; border: 0; padding: 9px 18px; border-radius: 999px; background: var(--line); color: #fff; }
  .kcard.sk-quote { border-left: 0; padding: 14px 4px 12px; border-top: 1px solid color-mix(in srgb, var(--line) 35%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 35%, transparent); position: relative; }
  .kcard.sk-quote::before { content: "\201C"; position: absolute; top: -6px; right: 6px; font: 900 72px/1 Georgia, serif; color: color-mix(in srgb, var(--line) 22%, transparent); pointer-events: none; }
  .kcard.sk-quote .kl { color: var(--line); }
  .kcard.sk-quote .kq { font-size: 20.5px; line-height: 1.5; padding-right: 40px; }
  .kcard.sk-quote .ka { color: var(--line); }
  .kcard.sk-band { border-left: 0; padding: 0; border-radius: 12px; overflow: hidden; border: 1.5px solid color-mix(in srgb, var(--line) 30%, transparent); }
  .kcard.sk-band .kl { margin: 0; padding: 8px 18px; background: var(--line); color: #fff; letter-spacing: .04em; }
  .kcard.sk-band .kq { padding: 14px 18px 0; }
  .kcard.sk-band .kt { padding: 0 18px; }
  .kcard.sk-band .kr { padding: 0 18px 16px; }
  .kcard.sk-line .kl { color: var(--line); }
  html.dark .kcard.sk-tint { background: color-mix(in srgb, var(--line) 20%, #16181b); }
  html.dark .kcard.sk-quote .ka, html.dark .kcard.sk-quote .kl, html.dark .kcard.sk-line .kl { color: color-mix(in srgb, var(--line) 55%, #fff); }
  @media (max-width: 420px) {
    .kcard.sk-tint { padding: 16px; } .kcard.sk-quote .kq { font-size: 18px; }
    .kcard.sk-band .kq, .kcard.sk-band .kt, .kcard.sk-band .kr { padding-left: 14px; padding-right: 14px; } .kcard.sk-band .kl { padding-left: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .kcard .ka .ar { transition: none; } }
  html.kc, html.kc body { background: transparent !important; height: auto; overflow: hidden; }
  html.kc body { min-height: 0; }
  html.kc #root { width: 100%; }
  .kcard { max-width: 100%; overflow-wrap: anywhere; }
  .kcard .kl { white-space: normal; max-width: 100%; border-radius: 14px !important; }
</style>

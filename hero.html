<style>
  :root { --coral:#D91E45; --ink:#14213D; --paper: #EEF2FF; --muted:#475069; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); }
  body { font-family: "Inter", "Noto Sans TC", "PingFang TC", sans-serif; color: var(--ink); overflow: hidden; }
  a.hero { display: flex; align-items: center; gap: 48px; height: 100%; padding: 32px 56px; text-decoration: none; color: inherit; max-width: 1240px; margin: 0 auto; }
  .txt { flex: 1 1 46%; min-width: 0; }
  .pic { flex: 1 1 54%; min-width: 0; }
  .pic img { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 18px 40px rgba(20,33,61,.18); transition: transform .3s ease; }
  a.hero:hover .pic img { transform: translateY(-4px); }
  .kicker { display: inline-flex; align-items: center; gap: 10px; font: 800 13px/1 "Inter", sans-serif; letter-spacing: .14em; color: #B8173A; }
  .kicker b { background: var(--coral); color: #fff; letter-spacing: .04em; padding: 6px 10px; border-radius: 999px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; }
  h1 { font: 900 44px/1.15 "Noto Sans TC", sans-serif; margin: 18px 0 10px; letter-spacing: .01em; }
  .sub { font: 500 19px/1.55 "Noto Sans TC", sans-serif; color: #414B66; }
  .meta { font: 500 15px/1.6 "Noto Sans TC", sans-serif; color: #5A6380; margin-top: 14px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--coral); color: #fff; font: 700 17px/1 "Noto Sans TC", sans-serif; padding: 16px 26px; border-radius: 999px; transition: background .2s; }
  a.hero:hover .btn { background: #B8173A; }
  .price { font: 700 16px/1.4 "Noto Sans TC", sans-serif; }
  .price em { font-style: normal; color: var(--coral); font-family: "Inter", sans-serif; font-weight: 800; font-size: 22px; }

  .kicker, .kicker b, .btn, .price { white-space: nowrap; }
  @media (max-width: 900px) {
    a.hero { gap: 24px; padding: 20px 24px; }
    .txt { flex-basis: 50%; }
    .pic { flex-basis: 50%; }
    .kicker { font-size: 11px; gap: 8px; }
    h1 { font-size: 30px; margin: 14px 0 6px; }
    .sub { font-size: 15px; }
    .meta { font-size: 13px; }
    .row { margin-top: 18px; }

    var u = "https://www.google-analytics.com/g/collect?" + p.toString();

<!-- 11/21 自動高度：手機版多了插畫，把實際高度傳給官網（GTM「內嵌區塊自動高度」）；電腦版維持原本 480。 -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var h = 480;
    if (window.innerWidth <= 600) {
      root.style.height = "auto"; document.body.style.height = "auto"; var a = document.getElementById("hero"); a.style.height = "auto";
      h = Math.max(480, Math.ceil(a.getBoundingClientRect().height + 16));
      root.style.height = ""; document.body.style.height = ""; a.style.height = "";
    }
    if (Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>

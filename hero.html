<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, indexifembedded">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁課程橫幅</title>
<!--
  ★ 11/21 配色方案 C（全淺色頁首：淡藍 #EEF2FF、海軍藍字 #14213D、珊瑚 #D91E45、綠 #007F52）。退回：上傳 線上原版備份/DTADS/hero.html。
  官網首頁第一屏：第一門課橫幅（2026/10/15 製作）
  - 依台北日期自動換字：11/01 前「11/01（日）開賣」＋按鈕「免費看 5 分鐘課程介紹」連到 EP00（10/27，不倒數、不再連 LINE），11/01 起「現正上線」＋「看課程」連到 PressPlay
  - 11/20：改成深色底（跟 /workshops、/enterprise 頁首一致）；早鳥只寫截止時間、不寫名額，11/25 00:00（台北）起自動換成 3 人團價（EARLY_END）
  - 預覽：?date=2026-11-02、?plan=regular
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/hero.html" width="100%" height="480" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --coral:#D91E45; --ink:#14213D; --paper: #EEF2FF; --muted:#475069; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); }
  body { font-family: "Inter", "Noto Sans TC", "PingFang TC", sans-serif; color: var(--ink); overflow: hidden; }
  a.hero { display: flex; align-items: center; gap: 48px; height: 100%; padding: 32px 56px; text-decoration: none; color: inherit; max-width: 1240px; margin: 0 auto; }
  .txt { flex: 1 1 46%; min-width: 0; }
  .pic { flex: 1 1 54%; min-width: 0; }
  .pic img { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 18px 40px rgba(20,33,61,.18); transition: transform .3s ease; }
  a.hero:hover .pic img { transform: translateY(-4px); }
  .kicker { display: inline-flex; align-items: center; gap: 10px; font: 800 13px/1 "Inter", sans-serif; letter-spacing: .14em; color: #B8173A; }
  .kicker b { background: var(--coral); color: #fff; letter-spacing: .04em; padding: 6px 10px; border-radius: 999px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; }
  h1 { font: 900 44px/1.15 "Noto Sans TC", sans-serif; margin: 18px 0 10px; letter-spacing: .01em; }
  .sub { font: 500 19px/1.55 "Noto Sans TC", sans-serif; color: #414B66; }
  .meta { font: 500 15px/1.6 "Noto Sans TC", sans-serif; color: #5A6380; margin-top: 14px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--coral); color: #fff; font: 700 17px/1 "Noto Sans TC", sans-serif; padding: 16px 26px; border-radius: 999px; transition: background .2s; }
  a.hero:hover .btn { background: #B8173A; }
  .price { font: 700 16px/1.4 "Noto Sans TC", sans-serif; }
  .price em { font-style: normal; color: var(--coral); font-family: "Inter", sans-serif; font-weight: 800; font-size: 22px; }

  .kicker, .kicker b, .btn, .price { white-space: nowrap; }
  @media (max-width: 900px) {
    a.hero { gap: 24px; padding: 20px 24px; }
    .txt { flex-basis: 50%; }
    .pic { flex-basis: 50%; }
    .kicker { font-size: 11px; gap: 8px; }
    h1 { font-size: 30px; margin: 14px 0 6px; }
    .sub { font-size: 15px; }
    .meta { font-size: 13px; }
    .row { margin-top: 18px; }
    .btn { font-size: 15px; padding: 13px 20px; }
  }
  /* 手機：封面在上，字在下（iframe 高度固定 480） */
  @media (max-width: 600px) {
    a.hero { flex-direction: column; align-items: stretch; justify-content: center; gap: 16px; padding: 16px; }
    .pic { flex: none; order: -1; }
    .pic img { border-radius: 10px; box-shadow: 0 10px 24px rgba(20,33,61,.14); }
    .txt { flex: none; }
    .kicker { font-size: 11px; }
    .kicker b { padding: 5px 8px; }
    h1 { font-size: 23px; margin: 10px 0 4px; }
    .sub { font-size: 14px; }
    .meta { font-size: 13px; margin-top: 6px; }
    .row { margin-top: 12px; gap: 10px 14px; }
    .btn { font-size: 15px; padding: 12px 20px; }
    .price { font-size: 14px; }
    .price em { font-size: 18px; }
  }
</style>
<style id="palette-c">/* 11/21 配色 C：頁首底部四色條 */ body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#1F4BFF 0 25%,#007F52 25% 50%,#7B2FF7 50% 75%,#FF3B5C 75%);}</style>
<style id="hero-ill">/* 11/21 頁首插畫：電腦版 插畫｜文字｜課程封面；手機版 封面→文字→插畫 */
  .ill { flex:0 0 auto; width:clamp(130px, 15vw, 210px); }
  .ill img { display:block; width:100%; height:auto; }
  a.hero { max-width:1320px; }
  @media (max-width: 900px) { .ill { width:120px; } }
  @media (max-width: 600px) {
    .ill { order:2; width:auto; display:flex; justify-content:center; }
    .ill img { width:auto; max-width:100%; max-height:150px; }
  }
</style>
</head>
<body>
<!-- 11/21 頁首插畫：img/hero_online-courses.webp（#EEF2FF 實色底，和頁首同色，不加框線陰影）。換圖只要覆蓋同名 webp（工具/壓頁首插畫.sh）。退回：上傳 頁首插畫包 線上原版備份/DTADS/hero.html。 -->
<a class="hero" id="hero" target="_blank" rel="noopener">
  <div class="ill"><img src="img/hero_online-courses.webp" width="640" height="756" alt="一個人坐在窗邊的桌前寫學習單，窗外有一條往前延伸的路" loading="eager" decoding="async"></div>
  <div class="txt">
    <div class="kicker">ONLINE COURSE <b id="status"></b></div>
    <h1>別急著找答案！</h1>
    <p class="sub">善用設計思考，打造你自己的人生藍圖</p>
    <p class="meta">8 堂錄影課＋8 份學習單・在 PressPlay 上課</p>
    <div class="row">
      <span class="btn" id="btn"></span>
      <span class="price" id="price"></span>
    </div>
  </div>
  <div class="pic"><img src="img/course1_cover.webp" alt="別急著找答案！善用設計思考，打造你自己的人生藍圖 課程封面" width="1200" height="675"></div>
</a>
<script>
(function () {
  // ===== 需要時才改的設定 =====
  var COURSE_URL = "https://www.pressplay.cc/link/s/DE956453";   // 第一門課_官網部落格 短網址
  var EP00_URL = "https://youtu.be/UnSkHuQmk7o";                    // 11/01 前（10/27 起）：按鈕連到 EP00 免費課程介紹（取代 LINE）
  var LAUNCH = "2026-11-01";                                       // 台北日期，這天中午 12:00 起顯示「現正上線」
  var EARLY_END = Date.parse("2026-11-25T00:00:00+08:00");   // 早鳥到 11/24（二）23:59，之後自動顯示 3 人團價
  var COURSE_PLAN = Date.now() < EARLY_END ? "early" : "regular";
  var PLANS = {
    early:   '早鳥 <em>NT$990</em>・到 11/24（二）23:59',
    regular: '3 人團 每人 <em>NT$1,190</em>'
  };

  var q = new URLSearchParams(location.search);
  if (q.get("plan") && PLANS[q.get("plan")]) COURSE_PLAN = q.get("plan");
  var today = q.get("date") || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);  // 台北日期
  var live = q.get("date") ? today >= LAUNCH : Date.now() >= Date.parse(LAUNCH + "T12:00:00+08:00");   // 10/27：PressPlay 改 11/01 中午 12:00 開賣

  document.getElementById("status").textContent = live ? "現正上線" : (today === LAUNCH ? "今天中午 12:00 開賣" : "11/01（日）中午開賣");
  document.getElementById("btn").textContent = live ? "看課程 →" : "免費看 5 分鐘課程介紹 →";
  document.getElementById("price").innerHTML = PLANS[COURSE_PLAN];
  document.getElementById("hero").href = live ? COURSE_URL + (COURSE_URL.indexOf("?") < 0 ? "?" : "&") + "utm_content=home-hero" : EP00_URL;
})();
</script>
<!-- 課程點擊追蹤（2026/10/17；10/20 加 LINE；10/27 加 EP00 送 ep00_click、小測驗送 quiz_click）：點到 PressPlay 連結送 pressplay_click、點到 LINE（lin.ee）送 line_click，每次點擊只送一個事件到官網 GA4。
     不載入 gtag.js（避免 GA 自動記錄捲動、瀏覽，灌水官網流量）；不含個人資料。測試時網址加 ?ga=off 可關閉。 -->
<script>
(function () {
  var SITE_GA4_ID = "G-Y0VX6H9PVX";   // 官網 GA4（DT POW WOW - GA4-New）；空字串＝關閉
  var WIDGET = "home-hero";
  var qs = new URLSearchParams(location.search);
  if (!SITE_GA4_ID || qs.get("ga") === "off") return;
  function cid() {
    var id = "";
    try { id = localStorage.getItem("dt_pp_cid") || ""; } catch (e) {}
    if (!id) { id = Math.floor(Math.random() * 2147483647) + "." + Math.floor(Date.now() / 1000); try { localStorage.setItem("dt_pp_cid", id); } catch (e) {} }
    return id;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href*='pressplay'], a[href*='lin.ee'], a[href*='youtu'], a[href*='playground']") : null;
    if (!a) return;
    var now = Math.floor(Date.now() / 1000);
    var p = new URLSearchParams({ v: "2", tid: SITE_GA4_ID, cid: cid(), sid: String(now), sct: "1", seg: "1", _et: "1",
      en: /lin\.ee/.test(a.href) ? "line_click" : /youtu/.test(a.href) ? "ep00_click" : /playground/.test(a.href) ? "quiz_click" : "pressplay_click", dl: location.href.slice(0, 300), dr: document.referrer.slice(0, 300),
      "ep.widget": WIDGET, "ep.link_url": a.href.slice(0, 100), "ep.parent_page": (qs.get("post") || document.referrer || "").slice(0, 100) });
    var u = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (!(navigator.sendBeacon && navigator.sendBeacon(u))) { var i = new Image(); i.src = u; }
  }, true);
})();
</script>
<!-- 11/21 自動高度：手機版多了插畫，把實際高度傳給官網（GTM「內嵌區塊自動高度」）；電腦版維持原本 480。 -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var h = 480;
    if (window.innerWidth <= 600) {
      root.style.height = "auto"; document.body.style.height = "auto"; var a = document.getElementById("hero"); a.style.height = "auto";
      h = Math.max(480, Math.ceil(a.getBoundingClientRect().height + 16));
      root.style.height = ""; document.body.style.height = ""; a.style.height = "";
    }
    if (Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

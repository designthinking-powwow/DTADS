<style>
  :root { --cobalt:#1F4BFF; --coral:#D91E45; --violet:#7B2FF7; --ink:#14213D; --muted:#475069; --cream:#FBF6EF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#EEF2FF; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; align-items:center; }
  .w { max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--cobalt); }
  h1 { font:900 50px/1.25 "Noto Sans TC",sans-serif; margin:16px 0 18px; }
  .lead { font:500 18px/1.8 "Noto Sans TC",sans-serif; color:#414B66; max-width:760px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:40px; }
  a.c { display:flex; flex-direction:column; text-decoration:none; color:var(--ink); background:#fff; box-shadow:inset 0 0 0 1px #D5DCF0; border-radius:18px; padding:24px 24px 22px; border-top:6px solid; transition:transform .25s; }
  a.c:hover { transform:translateY(-4px); }
  .c1 { border-color:var(--cobalt) !important; } .c2 { border-color:var(--coral) !important; } .c3 { border-color:var(--violet) !important; }
  .c i { font:800 12px/1 Inter,sans-serif; font-style:normal; letter-spacing:.14em; color:var(--muted); }
  .c b { font:900 22px/1.35 "Noto Sans TC",sans-serif; margin:12px 0 8px; }
  .c span { font:500 14.5px/1.7 "Noto Sans TC",sans-serif; color:var(--muted); flex:1; }
  .c em { font:700 15px "Noto Sans TC",sans-serif; font-style:normal; margin-top:14px; }
  .c1 em { color:var(--cobalt); } .c2 em { color:var(--coral); } .c3 em { color:var(--violet); }
  @media (max-width: 760px) {
    .w { padding:0 16px; }
    h1 { font-size:30px; margin:12px 0 12px; }
    .lead { font-size:15px; line-height:1.75; }
    .cards { grid-template-columns:1fr; gap:10px; margin-top:24px; }
    a.c { padding:14px 16px; border-top:0; border-left:6px solid; display:grid; grid-template-columns:1fr auto; column-gap:10px; align-items:center; }
    .c i { display:none; }

<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「內嵌區塊自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。
     量高度時先暫時把 html／body 的 100% 高度拿掉，量到的是「內容本身」的高度，不會跟著 iframe 一起長高。 -->
<style>html.dt-measure, html.dt-measure body { height:auto !important; min-height:0 !important; }</style>
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var b = document.body;
    root.classList.add("dt-measure");
    var cs = getComputedStyle(b), pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    var inner = b.getBoundingClientRect().height - pt - pb;
    root.classList.remove("dt-measure");
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（原本的 padding 比較大就用原本的）
    var h = Math.ceil(inner + Math.max(room, pt) + Math.max(room, pb));
    if (!(inner > 40) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>

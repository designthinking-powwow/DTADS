<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --coral:#FF3B5C; --violet:#7B2FF7; --ink:#0F0E0E; --muted:#5C5552; --cream:#FBF6EF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--cream); }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; align-items:center; }
  .w { max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--violet); }
  h1 { font:900 50px/1.25 "Noto Sans TC",sans-serif; margin:16px 0 18px; }
  .lead { font:500 18px/1.8 "Noto Sans TC",sans-serif; color:var(--muted); max-width:760px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:40px; }
  a.c { display:flex; flex-direction:column; text-decoration:none; color:var(--ink); background:#fff; border-radius:18px; padding:24px 24px 22px; border-top:6px solid; transition:transform .25s; }
  a.c:hover { transform:translateY(-4px); }
  .c1 { border-color:var(--cobalt) !important; } .c2 { border-color:var(--coral) !important; } .c3 { border-color:var(--violet) !important; }
  .c i { font:800 12px/1 Inter,sans-serif; font-style:normal; letter-spacing:.14em; color:var(--muted); }
  .c b { font:900 22px/1.35 "Noto Sans TC",sans-serif; margin:12px 0 8px; }
  .c span { font:500 14.5px/1.7 "Noto Sans TC",sans-serif; color:var(--muted); flex:1; }
  .c em { font:700 15px "Noto Sans TC",sans-serif; font-style:normal; margin-top:14px; }
  .c1 em { color:var(--cobalt); } .c2 em { color:var(--coral); } .c3 em { color:var(--violet); }
  @media (max-width: 760px) {
    .w { padding:0 16px; }
    h1 { font-size:30px; margin:12px 0 12px; }
    .lead { font-size:15px; line-height:1.75; }
    .cards { grid-template-columns:1fr; gap:10px; margin-top:24px; }
    a.c { padding:14px 16px; border-top:0; border-left:6px solid; display:grid; grid-template-columns:1fr auto; column-gap:10px; align-items:center; }
    .c i { display:none; }
    .c b { font-size:17px; margin:0 0 2px; grid-column:1; }
    .c span { font-size:13px; line-height:1.5; grid-column:1; }
    .c em { grid-column:2; grid-row:1 / span 2; margin:0; font-size:22px; }
    .c em s { display:none; }
  }

<div class="w">
  <div class="k">ABOUT US</div>
  <h1>AI 給得出答案，<br>我們幫人把問題問對。</h1>
  <p class="lead">查查創意從 2011 年開始推廣設計思考。AI 很會給答案，但很多人問完，卻卡在「然後呢」。我們帶企業團隊、學校和想改變的個人，先看懂人、把問題問對，再動手做出可以拿去試的原型，AI 在這時候才真正幫得上忙。</p>

    <a class="c c3" target="_top" href="https://www.designthinking.com.tw/blog"><i>FREE</i><b>免費讀、免費聽</b><span>知識文章、Podcast 和每週三的《未來思考週報》。</span><em><s>看知識文章 </s>→</em></a>
  </div>

<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「iframe 自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。 -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0;
  function measure() {
    var b = document.body, cs = getComputedStyle(b), top = Infinity, bot = -Infinity;
    [].forEach.call(b.children, function (el) {
      if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
      var s = getComputedStyle(el);
      if (s.display === "none" || s.position === "fixed" || s.position === "absolute") return;
      var r = el.getBoundingClientRect();
      if (!r.height) return;
      top = Math.min(top, r.top - (parseFloat(s.marginTop) || 0));
      bot = Math.max(bot, r.bottom + (parseFloat(s.marginBottom) || 0));
    });
    if (!(bot > top)) return;
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（不夠時補足）
    var h = Math.ceil(bot - top + Math.max(room, parseFloat(cs.paddingTop) || 0) + Math.max(room, parseFloat(cs.paddingBottom) || 0));
    if (Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); [].forEach.call(document.body.children, function (el) { if (el.tagName !== "SCRIPT") ro.observe(el); }); }
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>

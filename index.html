<title>DT POW WOW 文章輪播廣告</title>
<!--
  ★ v7 內容卡版（2026/10/29 製作，查查 10/29 同意）：11/01（日）12:00 起，文章裡的兩個廣告位都換成「跟文章融合的內容卡」。
    ・查查 10/29 規則：文章裡所有行動只導兩個地方——企業內訓（/contactus）和 PressPlay 第一門課（短網址 DE956453／EP00 試看）。
    ・中段（第 1 格）＝內容卡池（CARDS，10 張：內訓 5、課程 5）：依文章 topic 挑相關的，每週一換一次（週數＋post 決定，同一人同一週同一篇看到同一張），
      同一個人不會連續看到同一張（localStorage 記最近看過）。
    ・文末（第 2 格）＝主要行動卡（MAIN），依 topic 只放一個：dt/ai→企業內訓、其他→線上課（新文章依「對應產品 A／B」）。
      中段不會挑到跟文末同一種行動（文末是課程，中段就不放課程卡）。
    ・時間：10/31 23:59 前＝原本的對照測試（完全沒變）；11/01 00:00–12:00 中段只放企業內訓卡、文末維持原本廣告；12:00 起全部切換。
    ・追蹤：dtads_impression／ad_click／ad_view_time 照舊送到 G-F759ZE2XD3，ad_id＝卡片代號（K-bizdt…），category＝K（中段卡）或 M（文末主要行動），
      ab＝pool 或 main，topic、post、slot 不變。各卡點擊率：07_開發部/數據API/dtads_cards_report.py。
    ・測試：?now=2026-11-01T09:00（模擬台北時間）、?date=2026-11-02（＝那天中午）、?card=K-bizdt（指定中段卡）、?slot=end（文末）、
      ?v=7（新文章）、?main=course／biz（新文章的文末行動）、?theme=dark／auto（深色）、?ga=off。
    ・換卡：改下面 CARDS（RESERVE 放候補）；每月汰換點擊率最差的 2 張；新卡也只能導企業內訓或 PressPlay 課程。
  官網文章輪播廣告 v5 課程風格版（2026/10/13，改成第二門課的視覺：粗黑體標題、單一藍色、白卡線條人物插圖；v4 設計版 2026/10/06）
  ─────────────────────────────────────────────
  設計：照〈插畫風格規範〉——米白底、黑色線條、暖灰，每則廣告只用「一個」鮮豔強調色，
    不同類別用不同強調色（輪播起來有變化但同一個品牌）；扁平色塊，不用漸層與陰影。
    每則廣告＝類別標籤＋襯線標題＋一句說明＋一顆實心按鈕＋（真實、具體的）說明短句；
    寬螢幕左邊放一張說明「這是什麼」的線條插圖。不用橘色當主色（Substack 本身是橘色）。
  嵌入方式（Kolable 文章內貼 iframe，高度 250）：
    舊文章：https://designthinking-powwow.github.io/DTADS/            → 一般組合
    新文章：https://designthinking-powwow.github.io/DTADS/?topic=dt   → 依主題加權
      topic 可用：dt（設計思考）、career（職涯／主管）、ai（AI 趨勢）、edu（教育）、general
    不放課程廣告：網址再加 &nocourse=1（寫到 DYL 的文章用）；新文章另加 &post=文章代稱，之後可在 NO_COURSE_POSTS 統一控制
  測試用：?date=2026-11-02 可模擬日期；?ad=A1 可指定顯示某一則。
  功能（與 v2／v3 相同）：主題加權、訂閱廣告內直接訂閱（Substack 官方訂閱框）、記得讀者、
    同一頁兩個版位不重複、追蹤碼、日期自動切換比例、第一次捲進畫面才播動畫（6 秒保險）。
  動畫：進場約 2 秒只播一次（插圖像白板筆一樣畫出來、標題逐字浮現、按鈕最後到位），
    之後只剩背景色塊極慢的漂移與按鈕很淡的呼吸光；「減少動態」時直接顯示完成畫面。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F2EA;  --ink: #0F0E0E;  --muted: #6B6257;  --line: #D6CFC4;
    --accent: #1F4BFF;  --on: #FFFFFF;   /* 每則廣告各自覆寫：強調色、按鈕上的字色 */
    --serif: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;   /* v5：標題也用粗黑體 */
    --sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper);
    font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  p { margin: 0; }

  /* ===== 舞台：250px 高的米色紙卡 ===== */
  #stage { position: relative; display: block; width: 100%; height: 250px; overflow: hidden;
    background: var(--paper); color: inherit; text-decoration: none; }
  /* 雜誌風上緣：一條黑線＋一小段強調色 */
  
  

  /* 背景小動態：底部一條細線，上面一顆強調色小點極慢地來回（扁平、不搶戲） */
  .rail { position: absolute; left: 26px; right: 26px; bottom: 12px; height: 1px; background: var(--line); z-index: 1; pointer-events: none; }
  .rail i { position: absolute; top: -3px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: glide 16s ease-in-out infinite alternate; }
  @keyframes glide { from { left: 0; } to { left: calc(100% - 7px); } }

  /* ===== 版型：左插圖＋右文字 ===== */
  .grid { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: 250px 1fr;
    align-items: center; gap: 28px; padding: 22px 34px 20px 26px; }
  .grid.no-art { grid-template-columns: 1fr; padding-left: 36px; }
  .grid.sub-grid { grid-template-columns: 1fr 336px; gap: 26px; padding: 22px 26px 20px 36px; }
  .art { height: 196px; display: flex; align-items: center; justify-content: center; }
  .art svg { width: 100%; height: 100%; overflow: visible; }
  /* v5：白色圓角卡片＋第二門課的線條人物插圖 */
  .card { position: relative; width: 100%; height: 100%; background: #fff; border-radius: 20px;
    box-shadow: 0 10px 28px rgba(15,14,14,.07); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .card img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .pill { position: absolute; left: 12px; top: 12px; height: 26px; padding: 0 12px; border-radius: 999px; background: var(--accent); color: #fff;
    font-family: Inter, var(--sans); font-size: 12px; font-weight: 800; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 6px; }
  .datechip { position: absolute; right: -10px; top: -12px; padding: 7px 12px 8px; border-radius: 12px; background: var(--ink); color: #fff; text-align: center; line-height: 1.15; }
  .datechip b { display: block; font-family: Inter, var(--sans); font-size: 21px; font-weight: 800; }
  .datechip span { font-size: 12px; font-weight: 700; color: #9DB0FF; }
  .copy { min-width: 0; }

  .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
    letter-spacing: .14em; color: var(--ink); margin-bottom: 9px; white-space: nowrap; }
  .kicker::before { content: none; }
  .kicker { color: var(--muted); }
  .kicker[data-en]::before { content: attr(data-en); font-family: Inter, var(--sans); font-weight: 800; letter-spacing: .12em; color: var(--accent);
    padding-right: 10px; margin-right: 2px; border-right: 1.5px solid var(--accent); line-height: 1; }
  .title { font-family: var(--serif); font-weight: 900; font-size: 26px; line-height: 1.32; letter-spacing: 0;
    margin-bottom: 8px; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
  .title .ch { display: inline-block; white-space: pre; }
  .title .ph { display: inline-block; max-width: 100%; }
  .sub { font-size: 14.5px; line-height: 1.6; color: var(--muted); margin-bottom: 14px; }
  .sub .ph { display: inline-block; max-width: 100%; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 20px;
    border-radius: 999px; background: var(--accent); color: var(--on); font-size: 15px; font-weight: 700; letter-spacing: .04em;
    border: 0; transition: background .2s ease, color .2s ease; }
  .btn .arr { font-size: 18px; line-height: 1; transition: transform .2s ease; }
  a#stage:hover .btn, a#stage:focus-visible .btn { background: var(--ink); color: #fff; }
  a#stage:hover .btn .arr, a#stage:focus-visible .btn .arr { transform: translateX(3px); }
  a#stage:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .proof { font-size: 12px; color: var(--muted); line-height: 1.45; min-width: 0; }
  .proof b { color: var(--ink); font-weight: 700; }

  /* 訂閱廣告：右側 Substack 訂閱框 */
  .embed-card { background: #fff; border: 0; border-radius: 20px; box-shadow: 0 10px 28px rgba(15,14,14,.07); overflow: hidden; height: 150px; }
  .embed-card iframe { display: block; width: 100%; height: 150px; border: 0; background: #fff; }
  .embed-note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  /* 結尾版／本週搶先看 */
  .proof .issue { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  /* D1 小測驗 */
  button.btn { cursor: pointer; font-family: inherit; }
  a.btn { text-decoration: none; }
  .textlink { background: none; border: 0; padding: 0; font: inherit; font-size: 12.5px; color: var(--ink);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .quiz .textlink { display: inline !important; }
  .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .qnum { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .qtitle { font-family: var(--serif); font-weight: 900; font-size: 19px; line-height: 1.35; margin-bottom: 10px; }
  .qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qopt { min-height: 44px; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
    font: inherit; font-size: 13.5px; font-weight: 500; line-height: 1.35; text-align: left; color: var(--ink); cursor: pointer; }
  .qopt:hover, .qopt:focus-visible { background: var(--accent); color: var(--on); outline: none; }
  .qopt.picked { background: var(--ink); color: #fff; }
  #pane.swap { animation: fade .35s ease-out both; }

  /* D2／D3 學習單表單 */
  .wsline { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .wsform { display: flex; gap: 8px; margin-bottom: 6px; }
  .wsform input { flex: 1; min-width: 0; height: 40px; border: 2px solid var(--ink); border-radius: 999px; padding: 0 16px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .consent { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .consent input { margin: 2px 0 0; flex: none; }
  .wsmsg { font-size: 12px; font-weight: 700; color: var(--ink); min-height: 16px; margin-top: 2px; }
  .wsmsg a { color: var(--ink); }
  .ws .title { font-size: 21px; margin-bottom: 6px; }
  .ws .kicker { margin-bottom: 6px; }

  /* 插圖共用：白板線條 */
  .ink { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .acc { fill: var(--accent); }
  .acc-s { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .paper { fill: #fff; }
  .lbl { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .lbl.on { fill: var(--ink); text-decoration: underline; }
  .tiny { font-family: var(--sans); font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .08em; }
  .big { font-family: var(--serif); font-weight: 900; fill: var(--ink); }
  .draw { stroke-dasharray: var(--len, 600); stroke-dashoffset: 0; }

  /* ===== 進場動畫（只播一次）===== */
  #stage.pre .kicker, #stage.pre .title .ch, #stage.pre .sub, #stage.pre .btn, #stage.pre .proof,
  #stage.pre .embed-card, #stage.pre .embed-note, #stage.pre .pop, #stage.pre .fade, #stage.pre .card { opacity: 0; }
  #stage.pre .draw { stroke-dashoffset: var(--len, 600); }
  #stage.pre .bar { transform: scaleY(.15); }
  #stage.pre .chipcard { transform: perspective(300px) rotateX(-90deg); opacity: 0; }
  #stage.pre .capsule { transform: translateX(-120px) rotate(-300deg); opacity: 0; }

  #stage.go .draw { animation: draw var(--dur, 1s) cubic-bezier(.45,.05,.35,1) both; animation-delay: var(--d, 0s); }
  #stage.go .pop { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d, 0s); }
  #stage.go .fade { animation: fade .5s ease-out both; animation-delay: var(--d, 0s); }
  #stage.go .kicker { animation: slideR .5s ease-out both .1s; }
  #stage.go .card { animation: fadeUp .7s cubic-bezier(.2,.7,.3,1) both .05s; }
  #stage.go .card .pill, #stage.go .card .datechip { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both .7s; }
  #stage.go .title .ch { animation: chIn .5s cubic-bezier(.2,.75,.25,1) both; animation-delay: calc(var(--i) * 28ms + .2s); }
  #stage.go .sub { animation: fadeUp .5s ease-out both .9s; }
  #stage.go .btn { animation: fadeUp .5s ease-out both 1.25s, breathe 3.4s ease-in-out 2.4s infinite; }
  #stage.go .proof { animation: fade .5s ease-out both 1.45s; }
  #stage.go .embed-card { animation: fadeUp .6s ease-out both .9s; }
  #stage.go .embed-note { animation: fade .5s ease-out both 1.3s; }
  #stage.go .bar { animation: bar 1.1s ease-in-out both; animation-delay: var(--d, .3s); }
  #stage.go .chipcard { animation: flip .8s cubic-bezier(.2,.7,.3,1) both .5s; }
  #stage.go .capsule { animation: roll .9s cubic-bezier(.25,.8,.3,1) both .15s; }
  #stage.go .lid { animation: lid .8s ease-in-out both 1.05s; transform-box: fill-box; transform-origin: 100% 100%; }
  #stage.go .letter { animation: letterUp .8s cubic-bezier(.2,.8,.3,1.1) both .55s; }

  @keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes chIn { from { opacity: 0; transform: translateY(.4em); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes breathe { 0%, 100% { transform: none; } 50% { transform: translateY(-2px); } }
  @keyframes bar { 0% { transform: scaleY(.15); } 30% { transform: scaleY(1); } 55% { transform: scaleY(.3); } 80% { transform: scaleY(.85); } 100% { transform: scaleY(var(--h, .6)); } }
  @keyframes flip { 0% { opacity: 0; transform: perspective(300px) rotateX(-90deg); } 60% { opacity: 1; transform: perspective(300px) rotateX(14deg); } 100% { opacity: 1; transform: none; } }
  @keyframes roll { from { opacity: 0; transform: translateX(-120px) rotate(-300deg); } to { opacity: 1; transform: none; } }
  @keyframes lid { 0%, 100% { transform: none; } 45% { transform: translate(4px, -10px) rotate(-24deg); } }
  @keyframes letterUp { from { transform: translateY(36px); } to { transform: none; } }
  .bar { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleY(var(--h, .6)); }
  .chipcard, .capsule { transform-box: fill-box; transform-origin: 50% 50%; }

  /* 減少動態：不播進場、不漂移、不呼吸 */
  @media (prefers-reduced-motion: reduce) {
    #stage *, .rail i { animation: none !important; transition: none !important; }
    .rail i { left: 0; }
  }

  /* ===== 中等寬度 ===== */
  @media (max-width: 760px) {
    .grid { grid-template-columns: 190px 1fr; gap: 22px; padding: 20px 24px 18px 20px; }
    .grid.sub-grid { grid-template-columns: 1fr 300px; padding-left: 26px; }
    .art { height: 170px; }
    .title { font-size: 23px; }
    .proof { display: none; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 150px 1fr; gap: 18px; }
    .art { height: 150px; }
    .grid.sub-grid { grid-template-columns: 1fr 280px; gap: 18px; padding-left: 20px; }
    .grid.sub-grid .title { font-size: 20px; }
    .grid.sub-grid .sub { display: none; }
  }
  /* ===== 手機：單欄（標籤、標題、說明、按鈕）===== */
  @media (max-width: 559px) {
    .grid, .grid.no-art { grid-template-columns: 1fr; padding: 20px 22px 18px; align-content: center; }
    .art { display: none; }
    .title { font-size: 21px; line-height: 1.38; }
    .sub { font-size: 13.5px; margin-bottom: 12px; }
    .btn { height: 38px; font-size: 14.5px; }
  }
  @media (max-width: 559px) {
    .qtitle { font-size: 16.5px; margin-bottom: 8px; }
    .qopt { font-size: 12.5px; padding: 5px 9px; }
    .quiz .sub { font-size: 12.5px; }
    .ws .title { font-size: 18px; }
    .wsline { font-size: 13px; }
    .consent { font-size: 10.5px; }
  }
  @media (max-width: 760px) { .quiz .textlink { display: inline !important; } }
  @media (max-width: 360px) {
    .grid, .grid.no-art { padding: 18px 18px 16px; }
    .title { font-size: 19px; }
    .sub { font-size: 13px; }
  }
</style>

<style>
  /* 10/24 文字卡：不像廣告，像文章裡作者多說的一段話 */
  html.tc, html.tc body { background: transparent !important; }
  #stage.textcard { box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden; height: 250px; padding: 18px 8px 18px 16px; border-left: 3px solid #1F4BFF;
    display: flex; flex-direction: column; justify-content: center; gap: 10px; background: transparent;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #22252b; }
  #stage.textcard .tk { margin: 0; font-size: 13px; letter-spacing: .08em; color: #6b6f78; }
  #stage.textcard .tp { margin: 0; font-size: 16.5px; line-height: 1.85; overflow-wrap: anywhere; }
  #stage.textcard .ta { align-self: flex-start; font-size: 16px; font-weight: 600; color: #1F4BFF; text-decoration: underline; text-underline-offset: 4px; }
  @media (max-width: 420px) { #stage.textcard { gap: 8px; } #stage.textcard .tp { font-size: 14.5px; line-height: 1.7; } #stage.textcard .ta { font-size: 15px; } }

  /* ===== v7 內容卡：像文章裡的一小段，左邊一條細色線＋一句問題＋一行說明＋一個「行動 →」連結；沒有底色、圖片、動畫 ===== */
  html.kc, html.kc body { background: transparent !important; height: auto; overflow: hidden; }
  html.kc body { min-height: 100vh; display: flex; align-items: center; }
  html.kc #root { width: 100%; }
  .kcard { --line: #1F4BFF; --q: #1f2328; --t: #585858; --muted: #7c818a; --link: #1F4BFF;
    box-sizing: border-box; width: 100%; margin: 10px 0; padding: 2px 6px 2px 18px; border-left: 3px solid var(--line);
    font-family: Roboto, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage.kcard { display: block; height: auto; overflow: visible; background: transparent; color: inherit; }

  function renderQuiz(ad, c, vars, blobs) {
    var root = document.getElementById("root");
    var votes = [0, 0, 0, 0, 0], last = 1, qi = -1;
    root.innerHTML =
      '<div id="stage" class="cat-D quiz" ' + vars + '>' + blobs +
        '<div class="grid">' +
          '<div class="art" id="quiz-art">' + artCard({ cat: "D", step: 1 }) + '</div>' +
          '<div class="copy" id="pane"></div>' +
        '</div>' +
      '</div>';
    var pane = document.getElementById("pane");
    function dots(n) {
      return '<div class="dots" aria-label="第 ' + (n + 1) + ' 題，共 3 題">' + [0, 1, 2].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + '</div>';
    }
    function showIntro() {
      pane.innerHTML =
        '<p class="kicker" data-en="' + enOf(ad) + '">' + esc(c.kicker) + '</p><p class="title">' + titleHTML(c) + '</p>' +
        '<p class="sub">' + phr(QUIZ.intro.sub) + '</p>' +
        '<div class="row"><button type="button" class="btn" id="q-start">' + esc(QUIZ.intro.start) + '<span class="arr">→</span></button>' +
        '<a class="textlink proof" href="' + esc(withUtm(CONTACT_URL, "D1")) + '" target="_blank" rel="noopener">直接預約內訓諮詢</a></div>';
      document.getElementById("q-start").addEventListener("click", function () { qi = 0; showQ(); });
    }
    function showQ() {
      var q = QUIZ.questions[qi];
      pane.innerHTML =
        '<div class="qhead">' + dots(qi) + '<span class="qnum">' + (qi + 1) + '／3</span></div>' +
        '<p class="qtitle">' + esc(q.q) + '</p>' +
        '<div class="qopts">' + q.opts.map(function (o, i) { return '<button type="button" class="qopt" data-i="' + i + '">' + esc(o[0]) + '</button>'; }).join("") + '</div>';
      pane.classList.remove("swap"); void pane.offsetWidth; pane.classList.add("swap");
      [].forEach.call(pane.querySelectorAll(".qopt"), function (b) {
        b.addEventListener("click", function () {
          var step = q.opts[+b.getAttribute("data-i")][1];
          track("quiz_answer", { step: qi + 1, choice: QUIZ.results[step].key });
          votes[step]++; last = step; b.classList.add("picked");
          setTimeout(function () { qi++; if (qi < 3) showQ(); else showResult(); }, 220);
        });
      });
    }
    function showResult() {
      var best = last, max = votes[last];
      votes.forEach(function (v, i) { if (v > max) { max = v; best = i; } });
      var r = QUIZ.results[best];
      track("quiz_result", { result_step: r.key });
      document.getElementById("quiz-art").innerHTML = artCard({ cat: "D", step: best });
      pane.innerHTML =
        '<p class="kicker">團隊的下一步：' + esc(r.step) + '</p><p class="title">' + titleHTML({ title: r.title }) + '</p>' +
        '<p class="sub">' + phr(r.line) + '</p>' +
        '<div class="row"><a class="btn" href="' + esc(withUtm(CONTACT_URL, "D1-quiz-" + r.key)) + '" target="_blank" rel="noopener">預約內訓諮詢<span class="arr">→</span></a>' +
        '<button type="button" class="textlink proof" id="q-again">重新測一次</button></div>';
      pane.classList.remove("swap"); void pane.offsetWidth; pane.classList.add("swap");
      document.getElementById("q-again").addEventListener("click", function () { votes = [0, 0, 0, 0, 0]; qi = 0; showQ(); });
    }
    showIntro();
    setupIntro();
    analyticsAttach(ad);
  }

    { id: "K-cparent", group: "course", course: true, line: "#FF2D87", label: "給大人的線上課",
      q: "總在幫孩子想未來，上一次幫自己想，是什麼時候？",

  var RESERVE = [];   // 候補：每月汰換最差 2 張時，在這裡先寫好新卡（只能導企業內訓或 PressPlay 課程）
  // 文末主要行動（一篇只放一個）：只有線上課、企業內訓兩種
  var MAIN = {
    course: { id: "M-course", group: "course", line: "#1F4BFF", label: "線上課《別急著找答案！》",
      q: "這篇的問題，如果換成你自己的人生，要從哪裡開始拆？",

      a: "看看課程內容", u: PRESSPLAY_URL, a2: "先免費看介紹", u2: EP00_URL },
    biz: { id: "M-biz", group: "biz", line: "#2B59C3", label: "企業內訓｜設計思考・創意思考",
      q: "你們團隊也卡在這裡嗎？",
      t: "把你們正在處理的題目告訴我，一起看看設計思考或創意思考工作坊可以怎麼幫上忙。",

  };
  var TOPIC_MAIN = { career: "course", dt: "biz", ai: "biz", edu: "course", general: "course" };

  // >>> POST_MAIN（產生舊文對照表.py 自動產生，不要手改）

    "brands-in-house-content-production-forrester": "biz",

    "cross-department-collaboration": "biz",
    "doctors-ai-disclosure-patients-survey": "biz",
    "employee-motivation-deloitte-four-trust-pillars": "biz",
    "employee-trust-leaders-bcg-dropbox": "biz",
    "enterprise-ai-adoption-how-to-start": "biz",
    "esg-employee-engagement": "biz",
    "esg-training-how-to-plan": "biz",
    "experience-gifts-holiday-shopping-survey": "biz",
    "hard-to-reach-service-design": "biz",
    "how-to-give-negative-feedback": "biz",
    "intelligence-trap": "biz",

    "why-organizational-change-fails-deloitte": "biz",
    "why-young-people-dont-want-to-be-managers": "biz"};
  // <<< POST_MAIN

  function poolOn() {
    if (params.get("pool") === "1") return true;
    if (params.get("ab") === "text" || params.get("ab") === "banner") return false;   // 測試舊版對照組
    return nowMs() >= POOL_AT;
  }
  function articleTopic() { var t = params.get("topic") || "general"; return TOPIC_MAIN[t] ? t : "general"; }
  function noCourseHere() { return params.get("nocourse") === "1" || NO_COURSE_POSTS.indexOf(params.get("post") || "") >= 0; }
  function courseOk() { return launched() && !noCourseHere(); }
  // 文末要放哪一個主要行動（中段也用這個來避開同一種行動）
  // career／general／edu → 線上課；dt／ai → 企業內訓；新文章 build.py 依「對應產品 A／B」給 &main=course／biz。DYL 文章（不放課程）→ 企業內訓
  function mainFor() {
    if (!launched()) return null;                      // 12:00 前文末維持原本的廣告
    var k = TOPIC_MAIN[articleTopic()];
    var pm = params.get("main") || POST_MAIN[params.get("post") || ""];   // 新文章：build.py 給 &main=；舊文章：查 POST_MAIN
    if (pm && MAIN[pm]) k = pm;
    if (k === "course" && !courseOk()) k = "biz";
    return MAIN[k];
  }
  function hash(str) {                                 // FNV-1a，回傳 0–1 之間
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) + 0.5) / 4294967296;
  }
  function weekNo() { return Math.floor((Math.floor((nowMs() + 8 * 3600e3) / 864e5) + 3) / 7); }   // 台北時間，每週一 00:00 換
  function pickCard() {
    var forced = params.get("card");
    if (forced) { var f = CARDS.concat(RESERVE).filter(function (c) { return c.id === forced; })[0]; if (f) return f; }
    var topic = articleTopic(), main = mainFor(), avoid = main ? main.group : "";
    var allowed = CARDS.filter(function (c) { return !(c.course && !courseOk()); });   // 12:00 前、DYL 文章：只有企業內訓卡
    var ok = allowed.filter(function (c) { return c.group !== avoid; });
    if (!ok.length) ok = allowed;                      // 兩格都只能放企業內訓時（DYL 文章），中段放另一張內訓卡
    var rel = ok.filter(function (c) { return (c.topics[topic] || 0) > 0; });
    if (rel.length < 3) rel = rel.concat(ok.filter(function (c) { return rel.indexOf(c) < 0 && (c.topics.general || 0) > 0; }));
    if (!rel.length) rel = ok.length ? ok : CARDS.slice(0, 1);
    var post = params.get("post") || "", key = post + "|" + weekNo();
    // 依權重的固定隨機順序：同一篇、同一週，每個人算出來的順序都一樣
    var order = rel.map(function (c) { return { c: c, k: -Math.log(hash(key + "|" + c.id)) / (c.topics[topic] || 0.5) }; })
                   .sort(function (a, b) { return a.k - b.k; }).map(function (x) { return x.c; });
    var picks = store("dtads_k_picks") || {}, seen = store("dtads_k_seen") || [];
    var mine = post && picks[key];
    var chosen = mine && order.filter(function (c) { return c.id === mine; })[0];
    if (!chosen) {
      var recent = seen.slice(-2);                     // 最近看過的 2 張先跳過，避免連續看到同一張
      chosen = order.filter(function (c) { return recent.indexOf(c.id) < 0; })[0] || order[0];
      if (post) {
        picks[key] = chosen.id;
        var ks = Object.keys(picks); if (ks.length > 40) ks.slice(0, ks.length - 40).forEach(function (x) { delete picks[x]; });
        store("dtads_k_picks", picks);
      }
    }
    if (seen[seen.length - 1] !== chosen.id) { seen.push(chosen.id); store("dtads_k_seen", seen.slice(-6)); }
    return chosen;
  }
  function cardHref(c, url, suffix) {
    var u = withUtm(url, c.id + (suffix || ""));
    try {                                               // 加上是哪一篇文章（PressPlay 短網址保留自己的 UTM，只改 utm_content）
      var x = new URL(u), post = params.get("post");
      if (post && x.hostname.indexOf("designthinking") >= 0 || post && x.hostname.indexOf("github.io") >= 0) x.searchParams.set("utm_term", post.slice(0, 60));
      return x.toString();
    } catch (e) { return u; }
  }
  function postHeight() {                               // 告訴官網（GTM 內嵌區塊自動高度）這張卡實際多高，iframe 會縮成剛好，不留空白
    try {
      var el = document.querySelector(".kcard"); if (!el || !window.parent || window.parent === window) return;
      var cs = getComputedStyle(el), h = Math.ceil(el.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom));
      if (h > 0) window.parent.postMessage({ dtadsHeight: Math.max(h, 96), dtadsKind: "card" }, "*");
    } catch (e) {}
  }
  function renderCard(c, kind) {
    var root = document.getElementById("root");
    var th = params.get("theme");
    document.documentElement.classList.add("kc");
    if (th === "dark" || (th === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
    root.innerHTML = '<div id="stage" class="kcard" style="--line:' + esc(c.line) + '" data-card="' + esc(c.id) + '">' +
      '<p class="kl">' + esc(c.label) + '</p>' +
      '<p class="kq">' + esc(c.q) + '</p>' +
      '<p class="kt">' + esc(c.t) + '</p>' +
      '<p class="kr"><a class="ka" href="' + esc(cardHref(c, c.u)) + '" target="_blank" rel="noopener">' + esc(c.a) + ' <span class="ar">→</span></a>' +
      (c.a2 ? '<a class="ka2" href="' + esc(cardHref(c, c.u2, "-2")) + '" target="_blank" rel="noopener">' + esc(c.a2) + '</a>' : "") + '</p>' +
    '</div>';
    analyticsAttach({ id: c.id, cat: kind === "main" ? "M" : "K", ab: kind === "main" ? "main" : "pool" });
    postHeight();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
    var lastW = window.innerWidth;
    window.addEventListener("resize", function () { if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; postHeight(); } });

  function earlierAdFrame() {                        // 同一篇文章裡，排在我前面的 iframe 是不是也是 DTADS 文章廣告（同網域才讀得到網址）
    try {
      var fs = window.parent.frames;
      for (var i = 0; i < fs.length; i++) {

      }
    } catch (e) {}
    return false;

  // ===== 同一頁兩個版位不重複 =====
  // 兩個 iframe 幾乎同時載入：各自登記「我顯示哪一則」到 localStorage。
  // 若另一個版位剛好選了同一則，號碼較大的那個改選別則（storage 事件會通知另一個 iframe）。
  var myKey = Math.random();
  var current = null;
  function freshSlots() {
    var page = store("dtads_page");
    return page && (Date.now() - page.t) < 5000 ? page.slots : [];
  }
  function claim(slots, ad) {
    var others = slots.filter(function (x) { return x.k !== myKey; });
    store("dtads_page", { t: Date.now(), slots: others.concat([{ k: myKey, id: ad.id, t: Date.now() }]) });
  }
  window.addEventListener("storage", function (e) {
    if (e.key !== "dtads_page" || !current || params.get("ad")) return;
    var slots = freshSlots();
    if (current && current.kcard) return;             // v7：內容卡／主要行動卡不跟另一格搶（兩格已經用不同規則挑，不會重複）
    var clash = slots.some(function (x) { return x.k !== myKey && x.id === current.id && x.k < myKey; });
    if (!clash) return;
    var taken = slots.filter(function (x) { return x.k !== myKey; }).map(function (x) { return x.id; });
    current = pickAd(taken);
    claim(slots, current);
    render(current);
  });
  setTimeout(function () {
    var slots = freshSlots();
    // 功能：同一頁第二個登記的版位＝文章結尾那一格，用結尾版文案
    // 只算 3 秒內剛登記的版位（同一頁的兩格幾乎同時載入；避免把「上一頁」誤認為同一頁）
    if (!params.get("slot") && slots.some(function (x) { return x.k !== myKey && x.t && Date.now() - x.t < 3000; })) SLOT_END = true;
    // v7：11/01 00:00 起中段＝內容卡；12:00 起文末＝主要行動卡（?ad= 指定廣告時照舊顯示廣告，方便測試）
    if (poolOn() && !params.get("ad")) {
      // v7：哪一格是文末，改用「文章裡排在我前面的 iframe 有沒有另一個 DTADS 文章廣告」判斷（比誰先載入可靠；兩格載入順序可能顛倒）
      if (!params.get("slot")) SLOT_END = false;
      var tries = 0;
      (function decide() {
        if (!params.get("slot") && !SLOT_END && earlierAdFrame()) SLOT_END = true;
        if (!params.get("slot") && !SLOT_END && ++tries < 10) { setTimeout(decide, 80); return; }   // 前一格可能還在載入，最多等約 0.7 秒
        var kc = SLOT_END ? mainFor() : pickCard();
        if (kc) {
          current = { id: kc.id, kcard: true };
          claim(slots, current);
          renderCard(kc, SLOT_END ? "main" : "pool");
        } else {
          current = pickAd(slots.map(function (x) { return x.id; }));
          claim(slots, current);
          render(current);
        }
      })();
      return;
    }
    current = pickAd(slots.map(function (x) { return x.id; }));
    claim(slots, current);
    render(current);
  }, Math.floor(Math.random() * 250));
})();

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DT POW WOW 文章輪播廣告</title>
<!--
  官網文章輪播廣告 v4 設計版（2026/10/06，查查創意 開發部＋行銷部）
  ─────────────────────────────────────────────
  設計：照〈插畫風格規範〉——米白底、黑色線條、暖灰，每則廣告只用「一個」鮮豔強調色，
    不同類別用不同強調色（輪播起來有變化但同一個品牌）；扁平色塊，不用漸層與陰影。
    每則廣告＝類別標籤＋襯線標題＋一句說明＋一顆實心按鈕＋（真實、具體的）說明短句；
    寬螢幕左邊放一張說明「這是什麼」的線條插圖。不用橘色當主色（Substack 本身是橘色）。
  嵌入方式（Kolable 文章內貼 iframe，高度 250）：
    舊文章：https://designthinking-powwow.github.io/DTADS/            → 一般組合
    新文章：https://designthinking-powwow.github.io/DTADS/?topic=dt   → 依主題加權
      topic 可用：dt（設計思考）、career（職涯／主管）、ai（AI 趨勢）、edu（教育）、general
  測試用：?date=2026-11-02 可模擬日期；?ad=A1 可指定顯示某一則。
  功能（與 v2／v3 相同）：主題加權、訂閱廣告內直接訂閱（Substack 官方訂閱框）、記得讀者、
    同一頁兩個版位不重複、追蹤碼、日期自動切換比例、第一次捲進畫面才播動畫（6 秒保險）。
  動畫：進場約 2 秒只播一次（插圖像白板筆一樣畫出來、標題逐字浮現、按鈕最後到位），
    之後只剩背景色塊極慢的漂移與按鈕很淡的呼吸光；「減少動態」時直接顯示完成畫面。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2EFEB;  --ink: #0F0E0E;  --muted: #6B6257;  --line: #D6CFC4;
    --accent: #1F4BFF;  --on: #FFFFFF;   /* 每則廣告各自覆寫：強調色、按鈕上的字色 */
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper);
    font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  p { margin: 0; }

  /* ===== 舞台：250px 高的米色紙卡 ===== */
  #stage { position: relative; display: block; width: 100%; height: 250px; overflow: hidden;
    background: var(--paper); color: inherit; text-decoration: none; }
  /* 雜誌風上緣：一條黑線＋一小段強調色 */
  #stage::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--ink); z-index: 5; }
  #stage::after { content: ""; position: absolute; left: 0; top: 0; width: 72px; height: 6px; background: var(--accent); z-index: 6; }

  /* 背景小動態：底部一條細線，上面一顆強調色小點極慢地來回（扁平、不搶戲） */
  .rail { position: absolute; left: 26px; right: 26px; bottom: 12px; height: 1px; background: var(--line); z-index: 1; pointer-events: none; }
  .rail i { position: absolute; top: -3px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: glide 16s ease-in-out infinite alternate; }
  @keyframes glide { from { left: 0; } to { left: calc(100% - 7px); } }

  /* ===== 版型：左插圖＋右文字 ===== */
  .grid { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: 250px 1fr;
    align-items: center; gap: 28px; padding: 22px 34px 20px 26px; }
  .grid.no-art { grid-template-columns: 1fr; padding-left: 36px; }
  .grid.sub-grid { grid-template-columns: 1fr 336px; gap: 26px; padding: 22px 26px 20px 36px; }
  .art { height: 196px; display: flex; align-items: center; justify-content: center; }
  .art svg { width: 100%; height: 100%; overflow: visible; }
  .copy { min-width: 0; }

  .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
    letter-spacing: .14em; color: var(--ink); margin-bottom: 9px; white-space: nowrap; }
  .kicker::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .title { font-family: var(--serif); font-weight: 900; font-size: 26px; line-height: 1.32; letter-spacing: .01em;
    margin-bottom: 8px; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
  .title .ch { display: inline-block; white-space: pre; }
  .title .ph { display: inline-block; max-width: 100%; }
  .sub { font-size: 14.5px; line-height: 1.6; color: var(--muted); margin-bottom: 14px; }
  .sub .ph { display: inline-block; max-width: 100%; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 20px;
    border-radius: 999px; background: var(--accent); color: var(--on); font-size: 15px; font-weight: 700; letter-spacing: .04em;
    border: 2px solid var(--ink); transition: background .2s ease, color .2s ease; }
  .btn .arr { font-size: 18px; line-height: 1; transition: transform .2s ease; }
  a#stage:hover .btn, a#stage:focus-visible .btn { background: var(--ink); color: #fff; }
  a#stage:hover .btn .arr, a#stage:focus-visible .btn .arr { transform: translateX(3px); }
  a#stage:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .proof { font-size: 12px; color: var(--muted); line-height: 1.45; min-width: 0; }
  .proof b { color: var(--ink); font-weight: 700; }

  /* 訂閱廣告：右側 Substack 訂閱框 */
  .embed-card { background: #fff; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; height: 150px; }
  .embed-card iframe { display: block; width: 100%; height: 150px; border: 0; background: #fff; }
  .embed-note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  /* 結尾版／本週搶先看 */
  .proof .issue { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  /* D1 小測驗 */
  button.btn { cursor: pointer; font-family: inherit; }
  a.btn { text-decoration: none; }
  .textlink { background: none; border: 0; padding: 0; font: inherit; font-size: 12.5px; color: var(--ink);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .quiz .textlink { display: inline !important; }
  .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .qnum { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .qtitle { font-family: var(--serif); font-weight: 900; font-size: 19px; line-height: 1.35; margin-bottom: 10px; }
  .qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qopt { min-height: 44px; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
    font: inherit; font-size: 13.5px; font-weight: 500; line-height: 1.35; text-align: left; color: var(--ink); cursor: pointer; }
  .qopt:hover, .qopt:focus-visible { background: var(--accent); color: var(--on); outline: none; }
  .qopt.picked { background: var(--ink); color: #fff; }
  #pane.swap { animation: fade .35s ease-out both; }

  /* D2／D3 學習單表單 */
  .wsline { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .wsform { display: flex; gap: 8px; margin-bottom: 6px; }
  .wsform input { flex: 1; min-width: 0; height: 40px; border: 2px solid var(--ink); border-radius: 999px; padding: 0 16px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .consent { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .consent input { margin: 2px 0 0; flex: none; }
  .wsmsg { font-size: 12px; font-weight: 700; color: var(--ink); min-height: 16px; margin-top: 2px; }
  .wsmsg a { color: var(--ink); }
  .ws .title { font-size: 21px; margin-bottom: 6px; }
  .ws .kicker { margin-bottom: 6px; }

  /* 插圖共用：白板線條 */
  .ink { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .acc { fill: var(--accent); }
  .acc-s { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .paper { fill: #fff; }
  .lbl { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .lbl.on { fill: var(--ink); text-decoration: underline; }
  .tiny { font-family: var(--sans); font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .08em; }
  .big { font-family: var(--serif); font-weight: 900; fill: var(--ink); }
  .draw { stroke-dasharray: var(--len, 600); stroke-dashoffset: 0; }

  /* ===== 進場動畫（只播一次）===== */
  #stage.pre .kicker, #stage.pre .title .ch, #stage.pre .sub, #stage.pre .btn, #stage.pre .proof,
  #stage.pre .embed-card, #stage.pre .embed-note, #stage.pre .pop, #stage.pre .fade { opacity: 0; }
  #stage.pre .draw { stroke-dashoffset: var(--len, 600); }
  #stage.pre .bar { transform: scaleY(.15); }
  #stage.pre .chipcard { transform: perspective(300px) rotateX(-90deg); opacity: 0; }
  #stage.pre .capsule { transform: translateX(-120px) rotate(-300deg); opacity: 0; }

  #stage.go .draw { animation: draw var(--dur, 1s) cubic-bezier(.45,.05,.35,1) both; animation-delay: var(--d, 0s); }
  #stage.go .pop { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d, 0s); }
  #stage.go .fade { animation: fade .5s ease-out both; animation-delay: var(--d, 0s); }
  #stage.go .kicker { animation: slideR .5s ease-out both .1s; }
  #stage.go .title .ch { animation: chIn .5s cubic-bezier(.2,.75,.25,1) both; animation-delay: calc(var(--i) * 28ms + .2s); }
  #stage.go .sub { animation: fadeUp .5s ease-out both .9s; }
  #stage.go .btn { animation: fadeUp .5s ease-out both 1.25s, breathe 3.4s ease-in-out 2.4s infinite; }
  #stage.go .proof { animation: fade .5s ease-out both 1.45s; }
  #stage.go .embed-card { animation: fadeUp .6s ease-out both .9s; }
  #stage.go .embed-note { animation: fade .5s ease-out both 1.3s; }
  #stage.go .bar { animation: bar 1.1s ease-in-out both; animation-delay: var(--d, .3s); }
  #stage.go .chipcard { animation: flip .8s cubic-bezier(.2,.7,.3,1) both .5s; }
  #stage.go .capsule { animation: roll .9s cubic-bezier(.25,.8,.3,1) both .15s; }
  #stage.go .lid { animation: lid .8s ease-in-out both 1.05s; transform-box: fill-box; transform-origin: 100% 100%; }
  #stage.go .letter { animation: letterUp .8s cubic-bezier(.2,.8,.3,1.1) both .55s; }

  @keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes chIn { from { opacity: 0; transform: translateY(.4em); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes breathe { 0%, 100% { transform: none; } 50% { transform: translateY(-2px); } }
  @keyframes bar { 0% { transform: scaleY(.15); } 30% { transform: scaleY(1); } 55% { transform: scaleY(.3); } 80% { transform: scaleY(.85); } 100% { transform: scaleY(var(--h, .6)); } }
  @keyframes flip { 0% { opacity: 0; transform: perspective(300px) rotateX(-90deg); } 60% { opacity: 1; transform: perspective(300px) rotateX(14deg); } 100% { opacity: 1; transform: none; } }
  @keyframes roll { from { opacity: 0; transform: translateX(-120px) rotate(-300deg); } to { opacity: 1; transform: none; } }
  @keyframes lid { 0%, 100% { transform: none; } 45% { transform: translate(4px, -10px) rotate(-24deg); } }
  @keyframes letterUp { from { transform: translateY(36px); } to { transform: none; } }
  .bar { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleY(var(--h, .6)); }
  .chipcard, .capsule { transform-box: fill-box; transform-origin: 50% 50%; }

  /* 減少動態：不播進場、不漂移、不呼吸 */
  @media (prefers-reduced-motion: reduce) {
    #stage *, .rail i { animation: none !important; transition: none !important; }
    .rail i { left: 0; }
  }

  /* ===== 中等寬度 ===== */
  @media (max-width: 760px) {
    .grid { grid-template-columns: 190px 1fr; gap: 22px; padding: 20px 24px 18px 20px; }
    .grid.sub-grid { grid-template-columns: 1fr 300px; padding-left: 26px; }
    .art { height: 170px; }
    .title { font-size: 23px; }
    .proof { display: none; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 150px 1fr; gap: 18px; }
    .art { height: 150px; }
    .grid.sub-grid { grid-template-columns: 1fr 280px; gap: 18px; padding-left: 20px; }
    .grid.sub-grid .title { font-size: 20px; }
    .grid.sub-grid .sub { display: none; }
  }
  /* ===== 手機：單欄（標籤、標題、說明、按鈕）===== */
  @media (max-width: 559px) {
    .grid, .grid.no-art { grid-template-columns: 1fr; padding: 20px 22px 18px; align-content: center; }
    .art { display: none; }
    .title { font-size: 21px; line-height: 1.38; }
    .sub { font-size: 13.5px; margin-bottom: 12px; }
    .btn { height: 38px; font-size: 14.5px; }
  }
  @media (max-width: 559px) {
    .qtitle { font-size: 16.5px; margin-bottom: 8px; }
    .qopt { font-size: 12.5px; padding: 5px 9px; }
    .quiz .sub { font-size: 12.5px; }
    .ws .title { font-size: 18px; }
    .wsline { font-size: 13px; }
    .consent { font-size: 10.5px; }
  }
  @media (max-width: 760px) { .quiz .textlink { display: inline !important; } }
  @media (max-width: 360px) {
    .grid, .grid.no-art { padding: 18px 18px 16px; }
    .title { font-size: 19px; }
    .sub { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  // ===== 需要時才改的設定 =====
  // 10/14 Podcast 公開後，填入節目頁網址；空字串＝不顯示 Podcast 廣告
  var PODCAST_URL = "";
  // PressPlay 課程審核通過後，填入課程頁網址；空字串＝不顯示課程廣告
  var PRESSPLAY_URL = "";

  var SUBSCRIBE_URL = "https://chachacreative101.substack.com/subscribe";
  var EMBED_URL = "https://chachacreative101.substack.com/embed";
  var CONTACT_URL = "https://www.designthinking.com.tw/contactus";
  // 扭蛋島遊戲廣告：查查 10/06 指示「先製作好，先不要上」→ 要上線時把 false 改成 true
  var GAME_ENABLED = false;
  var GAME_URL = GAME_ENABLED ? "https://designthinking-powwow.github.io/dream-island/" : "";
  var HIDE_SUBSCRIBE_DAYS = 30;
  var HIDE_GAME_DAYS = 14;

  // 老師免費學習單（D2／D3）：學習單 PDF 與 Apps Script 準備好之前先關閉，關閉時顯示一般的「洽詢」按鈕
  // 上線步驟見 README.md：把 PDF 放上雲端、部署「學習單_收名單.gs」，把網址填進下面兩行，再把 false 改成 true
  var WORKSHEET_ENABLED = false;
  var WORKSHEET_ENDPOINT = "";   // Apps Script 網頁應用程式網址（…/exec）
  var WORKSHEET_PDF_URL = "";    // 備用：Apps Script 沒回傳網址時用這個

  // 廣告專用 GA4（和官網的 GA4 分開，避免 iframe 把官網使用者重複計算）；空字串＝完全不載入追蹤程式
  // 建立方式見 README「建立廣告專用 GA4」，把評估 ID（G-XXXXXXX）貼進來
  var ADS_GA4_ID = "G-F759ZE2XD3";   // 「官網輪播廣告」專用資源（查查 10/06 建立）

  // 本週週報搶先看：GitHub Actions 每天把 Substack 最新一期寫進 latest-issue.json（同一個網站，沒有跨網域問題）
  var LATEST_ISSUE_URL = "./latest-issue.json";

  // ===== 依位置、依時段換文案（行銷部可直接改這裡）=====
  // end＝文章結尾那一格（同一頁第二個載入的版位）；morning 05–11、day 11–17、evening 17–05（台北時間）
  // 沒寫到的時段就用廣告本身的文案
  var COPY_VARIANTS = {
    A: {
      end:     { title: "讀完了？每週三再幫你挑 3 篇", sub: "每週精選 3 篇值得讀的研究，加上一件這週就能試的小事。" }
    },
    A1: {
      morning: { title: "上班前 3 分鐘，先想清楚一件事", sub: "每週三早上 7 點寄出：AI 趨勢、未來思考、職涯發展，一封信讀完。" },
      evening: { title: "下班後還在想工作嗎？", sub: "每週三一封信，陪你把這週想清楚。3 分鐘讀完。" }
    },
    D5b: {
      day:     { title: "下午那場會，又只有主管在講？" }
    },
    D1: {
      morning: { title: "今天的會議，有先把問題說清楚嗎？" },
      evening: { title: "今天開的會，有解決真正的問題嗎？" }
    }
  };

  // D1 企業小測驗：「你的團隊卡在設計思考的哪一步？」3 題，每個選項對應一個步驟
  // 結果＝得票最多的步驟；同票時以第 3 題（團隊最想多一點的）為準
  var QUIZ = {
    // 開場用 D1 本身的標題（含依時段換的版本），說明句邀請做測驗
    intro: { sub: "你的團隊卡在設計思考的哪一步？3 個問題、10 秒鐘就知道。", start: "開始 3 題小測驗" },
    questions: [
      { q: "開會討論新點子時，最常發生的是？", opts: [
        ["很快就有答案，但不確定是不是使用者要的", 0], ["每個人心裡的問題都不一樣", 1],
        ["想來想去還是那幾個老點子", 2], ["想法很多，但一直停在簡報上", 3] ] },
      { q: "推出新服務或新流程後，常聽到的是？", opts: [
        ["「使用者其實不是這樣用的」", 0], ["「我們好像解錯問題了」", 1],
        ["「這跟去年的做法差不多」", 2], ["「早知道先找幾個人試試看」", 4] ] },
      { q: "團隊最想多一點的是？", opts: [
        ["走出去，聽使用者真正的聲音", 0], ["一句大家都同意的問題", 1],
        ["敢提出不一樣想法的氣氛", 2], ["做出來就拿去給人試的習慣", 4] ] }
    ],
    results: [
      { key: "empathize", step: "同理", title: "先走到使用者身邊", line: "你們很會解決問題，下一步是更靠近使用者。一次真正的訪談，常常就能看見新的答案。" },

            '<form id="ws-form" class="wsform" novalidate>' +
              '<input id="ws-email" type="email" required placeholder="老師的 Email" autocomplete="email" aria-label="Email">' +
              '<button type="submit" class="btn">寄給我<span class="arr">→</span></button>' +
            '</form>' +
            '<label class="consent"><input id="ws-ok" type="checkbox"> 我同意查查創意用這個 Email 寄送學習單與教學資訊，個資只用於此，可隨時取消。</label>' +
            '<p class="wsmsg" id="ws-msg" role="status"></p>' +
          '</div>' +
        '</div>' +
      '</div>';
    var form = document.getElementById("ws-form"), msg = document.getElementById("ws-msg");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("ws-email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "請輸入正確的 Email。"; return; }
      if (!document.getElementById("ws-ok").checked) { msg.textContent = "請先勾選同意，才能寄送學習單。"; return; }
      msg.textContent = "寄送中…";
      var done = function (pdf) {
        store("dtads_worksheet", Date.now());
        track("worksheet_submit");
        msg.innerHTML = '已寄出，也可以直接<a href="' + esc(pdf || WORKSHEET_PDF_URL || "#") + '" target="_blank" rel="noopener">下載學習單</a>。';
      };
      if (params.get("ws") === "mock") { setTimeout(function () { done("https://example.com/worksheet.pdf"); }, 300); return; }
      // Apps Script 用 text/plain 送出，不會觸發跨網域預檢；回傳 {ok, pdfUrl}
      fetch(WORKSHEET_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email, consent: true, source: ad.id }) })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.ok) done(d.pdfUrl); else msg.textContent = "暫時寄不出去，請稍後再試。"; })
        .catch(function () { msg.textContent = "暫時寄不出去，請稍後再試。"; });
    });
    setupIntro();
    analyticsAttach(ad);
  }

  // ===== 同一頁兩個版位不重複 =====
  // 兩個 iframe 幾乎同時載入：各自登記「我顯示哪一則」到 localStorage。
  // 若另一個版位剛好選了同一則，號碼較大的那個改選別則（storage 事件會通知另一個 iframe）。
  var myKey = Math.random();
  var current = null;
  function freshSlots() {
    var page = store("dtads_page");
    return page && (Date.now() - page.t) < 5000 ? page.slots : [];
  }
  function claim(slots, ad) {
    var others = slots.filter(function (x) { return x.k !== myKey; });
    store("dtads_page", { t: Date.now(), slots: others.concat([{ k: myKey, id: ad.id, t: Date.now() }]) });
  }
  window.addEventListener("storage", function (e) {
    if (e.key !== "dtads_page" || !current || params.get("ad")) return;
    var slots = freshSlots();
    var clash = slots.some(function (x) { return x.k !== myKey && x.id === current.id && x.k < myKey; });
    if (!clash) return;
    var taken = slots.filter(function (x) { return x.k !== myKey; }).map(function (x) { return x.id; });
    current = pickAd(taken);
    claim(slots, current);
    render(current);
  });
  setTimeout(function () {
    var slots = freshSlots();
    // 功能：同一頁第二個登記的版位＝文章結尾那一格，用結尾版文案
    // 只算 3 秒內剛登記的版位（同一頁的兩格幾乎同時載入；避免把「上一頁」誤認為同一頁）
    if (!params.get("slot") && slots.some(function (x) { return x.k !== myKey && x.t && Date.now() - x.t < 3000; })) SLOT_END = true;
    current = pickAd(slots.map(function (x) { return x.id; }));
    claim(slots, current);
    render(current);
  }, Math.floor(Math.random() * 250));
})();
</script>
</body>
</html>

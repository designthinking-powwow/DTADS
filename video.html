<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁一分鐘看懂</title>
<!--
  官網首頁 ⑥「一分鐘看懂這門課」（2026/10/15 製作）：第一門課宣傳影片（版本一）＋按鈕
  - 換影片：改 VIDEO_ID
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/video.html" width="100%" height="560" style="border:0;" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --coral:#FF3B5C; --ink:#0F0E0E; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--ink); color:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; overflow:hidden; display:flex; align-items:center; }
  .g { display:grid; grid-template-columns:1.5fr 1fr; gap:44px; align-items:center; max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .ph { aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; }
  .ph iframe { width:100%; height:100%; border:0; display:block; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--coral); }
  h2 { font:900 34px/1.3 "Noto Sans TC",sans-serif; margin:14px 0 12px; }
  p { font:500 17px/1.7 "Noto Sans TC",sans-serif; color:#CFC8C3; }
  .btn { display:inline-block; margin-top:24px; background:var(--coral); color:#fff; text-decoration:none; font:700 16px/1 "Noto Sans TC",sans-serif; padding:15px 24px; border-radius:999px; }
  @media (max-width: 600px) {
    .g { grid-template-columns:1fr; gap:16px; padding:0 16px; }
    h2 { font-size:22px; margin:8px 0 4px; }
    p { font-size:14px; }
    .btn { margin-top:12px; font-size:15px; padding:12px 20px; }
  }
</style>
</head>
<body>
<div class="g">
  <div class="ph"><iframe id="yt" title="別急著找答案！課程介紹" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div>
    <div class="k">1 MINUTE</div>
    <h2>為什麼你越努力，反而越模糊？</h2>
    <p>一分鐘看懂《別急著找答案！》在上什麼。</p>
    <a class="btn" id="btn" target="_blank" rel="noopener">看完整 5 分鐘課程介紹 →</a>
  </div>
</div>
<script>
  var VIDEO_ID = "Y9Z9FiUggQM";
  var COURSE_URL = "https://www.pressplay.cc/link/s/DE956453";
  var EP00_URL = "https://youtu.be/UnSkHuQmk7o";   // 11/01 前（10/27 起）：按鈕連到 EP00 完整 5 分鐘課程介紹
  var today = new URLSearchParams(location.search).get("date") || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);   // 預覽：?date=2026-11-02
  var live = (new URLSearchParams(location.search).get("date") ? today >= "2026-11-01" : Date.now() >= Date.parse("2026-11-01T12:00:00+08:00"));
  document.getElementById("yt").src = "https://www.youtube-nocookie.com/embed/" + VIDEO_ID + "?rel=0";
  document.getElementById("btn").href = live ? COURSE_URL + "?utm_content=home-video" : EP00_URL;
  document.getElementById("btn").textContent = live ? "看課程 →" : "看完整 5 分鐘課程介紹 →";
</script>
<!-- 課程點擊追蹤（2026/10/17；10/20 加 LINE；10/27 加 EP00 送 ep00_click、小測驗送 quiz_click）：點到 PressPlay 連結送 pressplay_click、點到 LINE（lin.ee）送 line_click，每次點擊只送一個事件到官網 GA4。
     不載入 gtag.js（避免 GA 自動記錄捲動、瀏覽，灌水官網流量）；不含個人資料。測試時網址加 ?ga=off 可關閉。 -->
<script>
(function () {
  var SITE_GA4_ID = "G-Y0VX6H9PVX";   // 官網 GA4（DT POW WOW - GA4-New）；空字串＝關閉
  var WIDGET = "home-video";
  var qs = new URLSearchParams(location.search);
  if (!SITE_GA4_ID || qs.get("ga") === "off") return;
  function cid() {
    var id = "";
    try { id = localStorage.getItem("dt_pp_cid") || ""; } catch (e) {}
    if (!id) { id = Math.floor(Math.random() * 2147483647) + "." + Math.floor(Date.now() / 1000); try { localStorage.setItem("dt_pp_cid", id); } catch (e) {} }
    return id;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href*='pressplay'], a[href*='lin.ee'], a[href*='youtu'], a[href*='playground']") : null;
    if (!a) return;
    var now = Math.floor(Date.now() / 1000);
    var p = new URLSearchParams({ v: "2", tid: SITE_GA4_ID, cid: cid(), sid: String(now), sct: "1", seg: "1", _et: "1",
      en: /lin\.ee/.test(a.href) ? "line_click" : /youtu/.test(a.href) ? "ep00_click" : /playground/.test(a.href) ? "quiz_click" : "pressplay_click", dl: location.href.slice(0, 300), dr: document.referrer.slice(0, 300),
      "ep.widget": WIDGET, "ep.link_url": a.href.slice(0, 100), "ep.parent_page": (qs.get("post") || document.referrer || "").slice(0, 100) });
    var u = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (!(navigator.sendBeacon && navigator.sendBeacon(u))) { var i = new Image(); i.src = u; }
  }, true);
})();
</script>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「內嵌區塊自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。
     量高度時先暫時把 html／body 的 100% 高度拿掉，量到的是「內容本身」的高度，不會跟著 iframe 一起長高。 -->
<style>html.dt-measure, html.dt-measure body { height:auto !important; min-height:0 !important; }</style>
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var b = document.body;
    root.classList.add("dt-measure");
    var cs = getComputedStyle(b), pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    var inner = b.getBoundingClientRect().height - pt - pb;
    root.classList.remove("dt-measure");
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（原本的 padding 比較大就用原本的）
    var h = Math.ceil(inner + Math.max(room, pt) + Math.max(room, pb));
    if (!(inner > 40) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

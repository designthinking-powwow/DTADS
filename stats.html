<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數字與合作單位</title>
<!--
  官網首頁 ⑦「數字＋合作單位」（2026/10/15 製作），取代原本的「創意教學里程碑」
  - 名單取自 Google 文件「合作單位」，挑大家認得的；若有企業提出異議，改成產業別寫法
  - 跑馬燈版（/workshops 用，名單較多、每次隨機排序）：stats.html?wall=1，高度 560
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/stats.html" width="100%" height="820" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --ink:#0F0E0E; --muted:#5C5552; --line:#E9E2DC; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
  .wrap { max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--cobalt); }
  h2 { font:900 36px/1.3 "Noto Sans TC",sans-serif; margin:14px 0 0; }
  .nums { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:40px; text-align:center; }
  .nums b { display:block; font:800 54px/1 Inter,sans-serif; color:var(--cobalt); }
  .nums span { display:block; margin-top:8px; font:500 15px "Noto Sans TC",sans-serif; color:var(--muted); }
  .clients { margin-top:44px; padding-top:28px; border-top:1px solid var(--line); }
  .clients h3 { font:700 15px "Noto Sans TC",sans-serif; color:var(--muted); margin-bottom:12px; }
  .g { display:grid; grid-template-columns:130px 1fr; gap:16px; padding:10px 0; border-bottom:1px dashed var(--line); font:500 16px/1.9 "Noto Sans TC",sans-serif; }
  .g:last-child { border-bottom:0; }
  .g b { font:700 14px/2.1 "Noto Sans TC",sans-serif; color:var(--cobalt); }
  .n { white-space:nowrap; }
  .clients i { font-style:normal; color:#C9C1BB; margin:0 8px; }
  /* 跑馬燈版 */
  .wall { margin-top:40px; padding-top:26px; border-top:1px solid var(--line); }
  .wall h3 { font:700 15px "Noto Sans TC",sans-serif; color:var(--muted); margin-bottom:14px; }
  .lane { overflow:hidden; margin:10px 0; -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); }
  .track { display:flex; gap:10px; width:max-content; animation:run var(--d) linear infinite; }
  .lane.rev .track { animation-direction:reverse; }
  .lane:hover .track { animation-play-state:paused; }
  .chip { white-space:nowrap; font:500 16px/1 "Noto Sans TC",sans-serif; padding:12px 18px; border-radius:999px; background:#F5F1EE; }
  .chip.c1 { background:#EAF0FF; } .chip.c3 { background:#F1EAFE; }
  @keyframes run { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .track { animation:none; flex-wrap:wrap; width:auto; } }
  @media (max-width: 760px) {
    .wall { margin-top:26px; padding-top:18px; }
    .chip { font-size:13.5px; padding:10px 14px; }
    .wrap { padding:0 16px; }
    h2 { font-size:24px; }
    .nums { grid-template-columns:repeat(4,1fr); gap:6px; margin-top:24px; }
    .nums b { font-size:24px; } .nums span { font-size:11.5px; margin-top:4px; }
    .clients { margin-top:28px; padding-top:20px; }
    .g { grid-template-columns:1fr; gap:2px; padding:8px 0; font-size:14px; line-height:1.85; }
    .g b { font-size:12.5px; line-height:1.6; }
    .clients i { margin:0 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="k">TRACK RECORD</div>
  <h2>超過三百場工作坊，<span style="white-space:nowrap">和這些團隊一起動手過</span></h2>
  <div class="nums">
    <div><b>3000+</b><span>學員</span></div>
    <div><b>2500+</b><span>教學時數</span></div>
    <div><b>300+</b><span>場實體課程</span></div>
    <div><b>200+</b><span>個課程企劃</span></div>
  </div>
  <div class="clients">
    <h3>合作過的企業與單位（部分）</h3>
    <div id="list"></div>
  </div>
</div>
<script>
  var WALL = [
    ["Google Taiwan","LINE","宜睿智慧 Edenred","羅氏藥廠","楊森藥廠","新思科技","遠傳電信","PressPlay Academy","精誠資訊","美律實業","明緯企業","iKala","Pinkoi","JustCo","Citiesocial","國泰世華銀行","中國信託商業銀行","第一銀行","合作金庫","土地銀行","上海銀行","臺灣中小企業銀行","群益投信","台灣金融研訓院","新光人壽","南山人壽","台灣人壽","康健人壽"],
    ["文化部","教育部","交通部","勞動部勞動力發展署","工研院","台灣設計研究院","中華民國中小企業總會","黑松教育基金會","學學文創教育基金會","立賢教育基金會","兒福聯盟","台灣公益聯盟","MeDA 博物館教育發展協會","POA 臺灣產品人學會","雜學校","桃園市立兒童美術館","新竹縣政府文化局"],
    ["台灣大學","政治大學","輔仁大學","淡江大學","中原大學","文化大學","世新大學","銘傳大學","臺北大學","長榮大學","高雄餐旅大學","明新科技大學","健行科技大學","景文科技大學","嶺東科技大學","南科實驗高中","板橋高中","復興商工"]
  ];
  if (new URLSearchParams(location.search).get("wall")) {
    var shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
    var lanes = WALL.map(function (names, k) {
      var chips = shuffle(names).map(function (n) { return '<span class="chip c' + (k + 1) + '">' + n + '</span>'; }).join("");
      return '<div class="lane' + (k === 1 ? ' rev' : '') + '"><div class="track" style="--d:' + (names.length * 3.2) + 's">' + chips + chips + '</div></div>';
    }).join("");
    document.querySelector(".clients").outerHTML = '<div class="wall"><h3>合作過的企業、政府、基金會與學校（部分）</h3>' + lanes + '</div>';
  }
  // 依「合作單位」文件分類；名字順序＝大家最認得的放前面
  var GROUPS = [
    ["外商", ["Google Taiwan","LINE","宜睿智慧 Edenred","羅氏藥廠","楊森藥廠","新思科技"]],
    ["科技・平台", ["遠傳電信","PressPlay Academy","精誠資訊","美律實業"]],
    ["金融", ["國泰世華銀行","中國信託商業銀行","第一銀行","合作金庫","土地銀行","上海銀行","臺灣中小企業銀行"]],
    ["保險", ["新光人壽","南山人壽","台灣人壽"]],
    ["政府・基金會", ["文化部","教育部","工研院","台灣設計研究院","學學文創教育基金會","黑松教育基金會"]],
    ["學校", ["台灣大學","政治大學"]]
  ];
  document.getElementById("list").innerHTML = GROUPS.map(function (g) {
    return '<div class="g"><b>' + g[0] + '</b><span>' + g[1].map(function (c) { return '<span class="n">' + c + '</span>'; }).join('<i>・</i>') + '</span></div>';
  }).join("");
</script>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「內嵌區塊自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。
     量高度時先暫時把 html／body 的 100% 高度拿掉，量到的是「內容本身」的高度，不會跟著 iframe 一起長高。 -->
<style>html.dt-measure, html.dt-measure body { height:auto !important; min-height:0 !important; }</style>
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var b = document.body;
    root.classList.add("dt-measure");
    var cs = getComputedStyle(b), pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    var inner = b.getBoundingClientRect().height - pt - pb;
    root.classList.remove("dt-measure");
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（原本的 padding 比較大就用原本的）
    var h = Math.ceil(inner + Math.max(room, pt) + Math.max(room, pb));
    if (!(inner > 40) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

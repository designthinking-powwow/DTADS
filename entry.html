<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁第一屏（企業優先）</title>
<!--
  官網首頁第一屏（2026/11/14 改版：企業優先。舊版＝兩張一樣大的入口卡，見 ../備份_線上原版/entry.html）
  - 查查 11/14「減少線上課程曝光、增加企業內訓」＋「直球對決」：第一屏只對企業說話，寫出問題、工作坊形式、適合誰、15 年超過三百場、合作單位。
  - 兩顆按鈕：看工作坊怎麼帶 → /workshops；聊聊你們的題目 → /contactus（原頁開啟 target=_top）
  - 個人入口縮成最下面一行小字：按了照舊捲到官網個人區（personal.html）播放 EP00；官網找不到個人區時另開 YouTube。
  - 合作單位只列官網 /designthinking 已公開的名稱（查查 10/13：客戶名稱可以公開，不寫案例細節）。
  - GA4 事件照舊交給官網 dataLayer（GTM 轉送）：home_entry_view {b2b_copy:"v3", b2c_copy:"line"}、home_entry_b2b {copy:"v3", target}、home_entry_b2c {copy:"line"}
  - Kolable 嵌入碼不變：<iframe src="https://designthinking-powwow.github.io/DTADS/entry.html" width="100%" height="600" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --coral: #FF3B5C; --coral-d: #E8243F; --ink: #0F0E0E; --paper: #FFF8F3; --muted: #5C5552; --cobalt: #1F4BFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); }
  body { font-family: "Inter", "Noto Sans TC", "PingFang TC", sans-serif; color: var(--ink); overflow: hidden; }
  a { color: inherit; }

  .entry { padding: 40px 0 44px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 56px; }
  .card { border-radius: 20px; padding: 44px 48px 36px; background: var(--ink); color: #fff; }
  .k { display: inline-flex; align-items: center; gap: 10px; font: 800 12px/1 Inter, sans-serif; letter-spacing: .16em; color: #9DB0FF; }
  .k i { font-style: normal; font: 700 13px/1 "Noto Sans TC", sans-serif; letter-spacing: .04em; padding: 6px 10px; border-radius: 999px; background: var(--cobalt); color: #fff; }
  .card h1 { font: 900 40px/1.3 "Noto Sans TC", sans-serif; margin: 20px 0 16px; letter-spacing: .01em; text-wrap: balance; max-width: 900px; }
  .card p { font: 500 18px/1.75 "Noto Sans TC", sans-serif; color: #CFC9C5; max-width: 820px; }
  .card p b { color: #fff; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .cta { display: inline-flex; align-items: center; gap: 8px; font: 700 17px/1 "Noto Sans TC", sans-serif; padding: 16px 26px; border-radius: 999px; text-decoration: none; white-space: nowrap; transition: background .2s, transform .2s; }
  .cta.main { background: var(--cobalt); color: #fff; }
  .cta.main:hover { background: #1236D6; transform: translateY(-2px); }
  .cta.sub { box-shadow: 0 0 0 2px #fff inset; color: #fff; }
  .cta.sub:hover { background: rgba(255,255,255,.08); transform: translateY(-2px); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .proof { margin-top: 30px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.16); display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
  .proof .n { font: 800 15px/1.5 Inter, "Noto Sans TC", sans-serif; color: #fff; }
  .proof .c { font: 500 15px/1.6 "Noto Sans TC", sans-serif; color: #A8A19D; }
  .self { margin: 16px 4px 0; font: 500 15px/1.6 "Noto Sans TC", sans-serif; color: var(--muted); }
  .self button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .self button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  @media (max-width: 1000px) {
    .wrap { padding: 0 24px; }
    .card { padding: 32px 28px 28px; }
    .card h1 { font-size: 30px; }
    .card p { font-size: 16px; }
  }
  @media (max-width: 680px) {
    .entry { padding: 16px 0 20px; }
    .wrap { padding: 0 16px; }
    .card { padding: 22px 18px 20px; border-radius: 16px; }
    .k { font-size: 10px; gap: 8px; } .k i { font-size: 12px; padding: 5px 8px; }
    .card h1 { font-size: 23px; line-height: 1.4; margin: 14px 0 10px; }
    .card p { font-size: 15px; line-height: 1.7; }
    .row { margin-top: 18px; gap: 10px; }
    .cta { font-size: 15px; padding: 13px 18px; }
    .proof { margin-top: 20px; padding-top: 16px; gap: 4px 16px; }
    .proof .n, .proof .c { font-size: 13.5px; }
    .self { font-size: 14px; margin-top: 12px; }
  }
</style>
</head>
<body>
<main class="entry" id="entry">
  <div class="wrap">
    <article class="card">
      <div class="k">FOR TEAMS <i>企業內訓・工作坊</i></div>
      <h1>新產品沒新意、不懂顧客要什麼、開會想不出點子？</h1>
      <p>我們到公司帶<b>設計思考、創意思考、未來思考工作坊</b>，3 小時到 2 天，用你們手上的真題目，做到能拿去試的方案。適合企業團隊，也帶學校與公部門。</p>
      <div class="row">
        <a class="cta main" href="https://www.designthinking.com.tw/contactus" target="_top" data-entry="b2b" data-target="contactus">聊聊你們的題目 →</a>
        <a class="cta sub" href="https://www.designthinking.com.tw/workshops" target="_top" data-entry="b2b" data-target="workshops">看工作坊怎麼帶</a>
      </div>
      <div class="proof">
        <span class="n">15 年・超過三百場工作坊</span>
        <span class="c">合作過 Google、LINE Taiwan、Roche、Johnson &amp; Johnson 與多家金融機構</span>
      </div>
    </article>
    <p class="self">想自己學設計思考、整理人生方向？<button type="button" data-entry="b2c">看線上課程介紹（5 分鐘）</button></p>
  </div>
</main>
<script>
(function () {
  var EP00_URL = "https://youtu.be/UnSkHuQmk7o";   // 官網找不到個人區時，另開 YouTube
  var inFrame = window.parent !== window;
  var q = new URLSearchParams(location.search);

  // 送給官網（GTM 轉成 dataLayer 事件）；直接打開這個檔時什麼都不送
  function tell(msg) { if (inFrame) { try { parent.postMessage(msg, "*"); } catch (e) {} } }
  function track(name, p) { tell({ ccHome: name, p: p || {} }); }

  // 11/14 改版：不再做 A/B，企業卡文案記為 v3、個人入口記為 line（一行小字）
  var shown = { b2b: "v3", b2c: "line" };
  track("home_entry_view", { b2b_copy: shown.b2b, b2c_copy: shown.b2c });

  // 官網有沒有 GTM 轉達、有沒有個人區：GTM 收到 hello 會回 ccHomeReady（1＝有個人區，0＝沒有）
  var relayReady = false, personalReady = false;
  window.addEventListener("message", function (e) {
    if (e.source !== parent || !/(^|\.)designthinking\.com\.tw$/.test(e.origin.replace(/^https?:\/\//, ""))) return;
    if (e.data && e.data.ccHomeReady !== undefined) { relayReady = true; personalReady = !!e.data.ccHomeReady; }
  });
  tell({ ccHome: "hello" });
  setTimeout(function () { tell({ ccHome: "hello" }); }, 1500);
  setTimeout(function () { tell({ ccHome: "hello" }); }, 4000);

  var cards = document.querySelectorAll("[data-entry]");
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener("click", function (ev) {
      var kind = this.getAttribute("data-entry");
      if (kind === "b2b") {
        // 企業卡：直接換頁的話，嵌入框會先被關掉，點擊事件送不到官網。
        // 有 GTM 轉達時，改由官網先記事件再換頁；沒有轉達時照連結原頁開啟。
        var tg = this.getAttribute("data-target") || "";
        if (relayReady) { ev.preventDefault(); tell({ ccHome: "home_entry_b2b", p: { copy: shown.b2b, target: tg }, go: this.href }); }
        else track("home_entry_b2b", { copy: shown.b2b, target: tg });
        return;
      }
      track("home_entry_b2c", { copy: shown.b2c });
      ev.preventDefault();
      if (personalReady) tell({ ccHome: "play_personal" });   // 官網捲到個人區並播放
      else window.open(EP00_URL, "_blank", "noopener");
    });
  }
})();
</script>
<!-- 把內容高度傳給官網（GTM「內嵌區塊自動高度」tag 31 會把嵌入框調成剛好的高度；沒收到時照嵌入碼的固定高度） -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0;
  function measure() {
    var h = Math.ceil(document.getElementById("entry").getBoundingClientRect().height);
    if (!(h > 80) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h, dtadsKind: "entry" }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, indexifembedded">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接著讀</title>
<!--
  11/27 接著讀卡（查查同意；近 28 天每次造訪只看 1.08 頁，目標 1.3 頁，12/14 檢查）。
  用法：next.html?post=<文章網址代稱>，從同目錄 next.json（next[slug]＝3 個 slug，cards[slug]＝{t 標題,w 一句,i 圖}，pre＝圖網址前綴，壓縮後約 72KB）取該篇的 3 篇相關文章；找不到就顯示 _default（全站熱門企業篇）。
  GA4：點擊送 next_read_click（post、to、slot），和 card.html 同一個 GA4（G-F759ZE2XD3）；?ga=off 不送。
  高度：postMessage dtadsHeight 回報官網，GTM「內嵌區塊自動高度」會調整 iframe（dtadsKind 用 card，不需改 GTM）。
  資料由 07_開發部/接著讀卡_20261127/build_next.py 產生。
-->
<style>
:root{--ink:#1d1d1f;--sub:#5a5a63;--line:#e4e4ea;--bg:#ffffff;--soft:#f5f6fa;--blue:#1F4BFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:18px 0}
html,body{background:transparent;overflow:hidden}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
h2{font-size:20px;font-weight:700}
.head span{font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
a.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);background:#fff;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.img{aspect-ratio:1200/630;background:var(--soft) center/cover no-repeat}
.txt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.t{font-size:15px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:13px;color:var(--sub);line-height:1.5}
.go{font-size:13px;font-weight:700;color:var(--blue);margin-top:2px}
@media(max-width:560px){
  .grid{grid-template-columns:1fr;gap:10px}
  a.card{flex-direction:row}
  .img{width:38%;flex:none;aspect-ratio:auto;min-height:96px}
  .txt{padding:8px 10px}
  .t{font-size:14px}
  .why{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h2>接著讀</h2><span>同一個問題，換個角度看</span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var post=(params.get("post")||"").slice(0,120);
  var ADS_GA4_ID="G-F759ZE2XD3";
  var GA_ID=params.get("ga")==="off"?"":(params.get("ga")||ADS_GA4_ID);
  var gaReady=false;
  if(GA_ID){
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){window.dataLayer.push(arguments);};
    gtag("js",new Date());
    gtag("config",GA_ID,{send_page_view:false,cookie_flags:"SameSite=None;Secure",anonymize_ip:true});
    var gs=document.createElement("script");gs.async=true;
    gs.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(GA_ID);
    document.head.appendChild(gs);gaReady=true;
  }
  function track(name,extra){
    if(!gaReady)return;
    var p={ad_id:"K-next",category:"K",post:post};
    for(var k in extra||{})p[k]=extra[k];
    gtag("event",name,p);
  }
  function postHeight(){
    try{
      if(!window.parent||window.parent===window)return;
      var w=document.querySelector(".wrap");if(!w)return;
      var h=Math.ceil(w.getBoundingClientRect().height);
      if(h>0)window.parent.postMessage({dtadsHeight:Math.max(h,96),dtadsKind:"card"},"*");
    }catch(e){}
  }
  var g=document.getElementById("grid");
  function render(list){
    g.innerHTML="";
    list.forEach(function(p,i){
      var a=document.createElement("a");a.className="card";a.target="_top";
      a.href="https://www.designthinking.com.tw/posts/"+encodeURIComponent(p.slug);
      a.innerHTML='<div class="img"></div><div class="txt"><div class="t"></div><div class="why"></div><div class="go">繼續讀 →</div></div>';
      a.querySelector(".img").style.backgroundImage="url('"+String(p.img).replace(/'/g,"%27")+"')";
      a.querySelector(".t").textContent=p.title;a.querySelector(".why").textContent=p.why;
      a.addEventListener("click",function(){track("next_read_click",{to:p.slug,slot:i+1,transport_type:"beacon"});});
      g.appendChild(a);
    });
    postHeight();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(postHeight);
  }
  fetch("next.json").then(function(r){return r.json();}).then(function(d){
    var ids=(post&&d.next&&d.next[post])||d._default||[];
    var l=ids.map(function(s){var c=d.cards[s];return c&&{slug:s,title:c.t,why:c.w,img:/^http/.test(c.i)?c.i:d.pre+c.i};}).filter(Boolean);
    render(l.slice(0,3));
  }).catch(function(){document.body.style.display="none";});
  var lastW=window.innerWidth;
  window.addEventListener("resize",function(){if(Math.abs(window.innerWidth-lastW)>40){lastW=window.innerWidth;postHeight();}});
  window.addEventListener("load",postHeight);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週報訂閱</title>
<!--
  官網首頁 ⑩「未來思考週報」訂閱（2026/10/15 製作）：鈷藍色整塊＋Substack 官方訂閱框
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/news.html" width="100%" height="600" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--cobalt); }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:#fff; overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; }
  .w { width:100%; max-width:720px; padding:0 16px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; opacity:.8; }
  h2 { font:900 36px/1.3 "Noto Sans TC",sans-serif; margin:14px 0 10px; }
  p { font:500 17px/1.7 "Noto Sans TC",sans-serif; color:#DCE3FF; }
  .box { margin:26px auto 0; max-width:480px; border-radius:14px; overflow:hidden; background:#fff; }
  .box iframe { display:block; width:100%; height:320px; border:0; }
  @media (max-width: 480px) { h2 { font-size:26px; } p { font-size:14.5px; } }
</style>
</head>
<body>
<div class="w">
  <div class="k">NEWSLETTER</div>
  <h2>《未來思考週報》</h2>
  <p>每週三早上 7 點，3 分鐘讀完一週值得想的事。免費。</p>
  <div class="box"><iframe src="https://chachacreative101.substack.com/embed" scrolling="no" title="訂閱未來思考週報"></iframe></div>
</div>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「iframe 自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。 -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0;
  function measure() {
    var b = document.body, cs = getComputedStyle(b), top = Infinity, bot = -Infinity;
    [].forEach.call(b.children, function (el) {
      if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
      var s = getComputedStyle(el);
      if (s.display === "none" || s.position === "fixed" || s.position === "absolute") return;
      var r = el.getBoundingClientRect();
      if (!r.height) return;
      top = Math.min(top, r.top - (parseFloat(s.marginTop) || 0));
      bot = Math.max(bot, r.bottom + (parseFloat(s.marginBottom) || 0));
    });
    if (!(bot > top)) return;
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（不夠時補足）
    var h = Math.ceil(bot - top + Math.max(room, parseFloat(cs.paddingTop) || 0) + Math.max(room, parseFloat(cs.paddingBottom) || 0));
    if (Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); [].forEach.call(document.body.children, function (el) { if (el.tagName !== "SCRIPT") ro.observe(el); }); }
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

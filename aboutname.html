<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名字的由來</title>
<!--
  /about 名字由來（2026/10/15 製作）：查查創意＝總品牌，Design Thinking POW WOW＝設計思考業務
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/aboutname.html" width="100%" height="460" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --coral:#FF3B5C; --ink:#0F0E0E; --muted:#5C5552; --cream:#FBF6EF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--cream); }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; align-items:center; }
  .w { max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--coral); }
  h2 { font:900 36px/1.3 "Noto Sans TC",sans-serif; margin:14px 0 0; }
  .names { display:grid; grid-template-columns:1.1fr 1fr; gap:18px; margin-top:26px; }
  .n { background:#fff; border-radius:18px; padding:24px 26px; }
  .n i { font:700 14px "Noto Sans TC",sans-serif; font-style:normal; color:var(--muted); }
  .n b { display:block; font:900 26px/1.2 "Noto Sans TC",sans-serif; margin:8px 0 12px; }
  .n p { font:400 15px/1.8 "Noto Sans TC",sans-serif; color:var(--muted); }
  .hint { display:none; }
  @media (max-width: 760px) {
    .w { padding:0 16px; }
    h2 { font-size:24px; }
    .names { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 16px; gap:10px; margin:18px -16px 0; padding:0 16px; scrollbar-width:none; }
    .names::-webkit-scrollbar { display:none; }
    .n { flex:0 0 86%; scroll-snap-align:start; padding:18px; }
    .n b { font-size:21px; margin:6px 0 8px; }
    .n p { font-size:13.5px; line-height:1.7; }
    .hint { display:block; font:500 12px "Noto Sans TC",sans-serif; color:#9A928D; margin-top:6px; }
  }
</style>
</head>
<body>
<div class="w">
  <div class="k">OUR NAME</div>
  <h2>名字的由來</h2>
  <div class="names">
    <div class="n"><i>品牌</i><b>查查創意 Cha Cha Creative</b><p>「Cha Cha」取自創辦人的姓，也像恰恰舞的節奏：輕快、有來有往，把想法一步一步踩出來。工作坊、線上課程、Podcast 和週報，都是查查創意的作品。</p></div>
    <div class="n"><i>設計思考工作坊</i><b>Design Thinking POW WOW</b><p>POW WOW 源自北美原住民的傳統聚會，大家帶著歌舞、故事和手藝來交流、互相學習。我們希望每一場工作坊都像這樣：不是一個人在台上講，而是一群人一起動手。</p></div>
  </div>
  <div class="hint">← 左右滑動看更多 →</div>
</div>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「iframe 自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。 -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0;
  function measure() {
    var b = document.body, cs = getComputedStyle(b), top = Infinity, bot = -Infinity;
    [].forEach.call(b.children, function (el) {
      if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
      var s = getComputedStyle(el);
      if (s.display === "none" || s.position === "fixed" || s.position === "absolute") return;
      var r = el.getBoundingClientRect();
      if (!r.height) return;
      top = Math.min(top, r.top - (parseFloat(s.marginTop) || 0));
      bot = Math.max(bot, r.bottom + (parseFloat(s.marginBottom) || 0));
    });
    if (!(bot > top)) return;
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（不夠時補足）
    var h = Math.ceil(bot - top + Math.max(room, parseFloat(cs.paddingTop) || 0) + Math.max(room, parseFloat(cs.paddingBottom) || 0));
    if (Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); [].forEach.call(document.body.children, function (el) { if (el.tagName !== "SCRIPT") ro.observe(el); }); }
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

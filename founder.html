<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --coral:#FF3B5C; --ink:#0F0E0E; --muted:#B9B1AC; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--ink); color:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; overflow:hidden; display:flex; align-items:center; }
  .w { max-width:1120px; width:100%; margin:0 auto; padding:0 48px; display:grid; grid-template-columns:1.2fr 1fr; gap:56px; align-items:center; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:#8FA6FF; }
  h2 { font:900 40px/1.25 "Noto Sans TC",sans-serif; margin:14px 0 6px; }
  .role { font:700 16px "Noto Sans TC",sans-serif; color:#FF8FA3; }
  .bio { font:400 16px/1.85 "Noto Sans TC",sans-serif; color:#DCD5D0; margin-top:18px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:26px; }
  a.b { display:inline-flex; font:700 16px/1 "Noto Sans TC",sans-serif; padding:15px 24px; border-radius:999px; text-decoration:none; transition:transform .2s; }
  a.b:hover { transform:translateY(-2px); }
  .cob { background:var(--cobalt); color:#fff; } .ghost { border:2px solid #fff; color:#fff; padding:13px 22px; }
  .tl { border-left:2px solid #3A3533; padding-left:22px; }
  .t { position:relative; padding:0 0 20px; }
  .t:last-child { padding-bottom:0; }
  .t::before { content:""; position:absolute; left:-29px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--coral); }
  .t b { font:800 18px/1 Inter,sans-serif; color:#fff; }
  .t span { display:block; font:500 15px/1.6 "Noto Sans TC",sans-serif; color:var(--muted); margin-top:6px; }
  @media (max-width: 760px) {
    .w { grid-template-columns:1fr; gap:22px; padding:0 16px; }
    h2 { font-size:28px; } .role { font-size:14px; }
    .bio { font-size:14px; line-height:1.75; margin-top:12px; }
    .row { margin-top:16px; gap:8px; } a.b { font-size:14.5px; padding:12px 18px; } .ghost { padding:10px 16px; }
    .tl { display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; border:0; padding:0; }
    .t { padding:0 0 0 12px; border-left:3px solid var(--coral); }
    .t::before { display:none; }
    .t b { font-size:15px; } .t span { font-size:12.5px; line-height:1.5; margin-top:4px; }
  }
</style>

<body>
<div class="w">
  <div>
    <div class="k">FOUNDER</div>
    <h2>Cha Cha（查恆）</h2>
    <div class="role">查查創意創辦人・設計思考講師</div>
    <p class="bio">2011 年第一次接觸設計思考，從此把它當成工作的方法，也當成生活的方法。帶過超過三百場工作坊，從企業、政府到學校，相信每個人都能學會把問題想清楚，再動手做出來。</p>
    <div class="row">
      <a class="b cob" target="_top" href="https://www.designthinking.com.tw/chacha">認識 Cha Cha →</a>
      <a class="b ghost" target="_top" href="https://www.designthinking.com.tw/contactus">聯絡我們</a>
    </div>
  </div>
  <div class="tl">
    <div class="t"><b>2011</b><span>第一次接觸設計思考，開始在台灣推廣</span></div>
    <div class="t"><b>2012–2019</b><span>學學文創學務長、營運長</span></div>
    <div class="t"><b>2016</b><span>到史丹佛大學 d.school 進修</span></div>
    <div class="t"><b>2017</b><span>參加德國 HPI 設計思考年會</span></div>
    <div class="t"><b>NOW</b><span>超過三百場企業、政府與學校工作坊</span></div>
  </div>
</div>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「內嵌區塊自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。
     量高度時先暫時把 html／body 的 100% 高度拿掉，量到的是「內容本身」的高度，不會跟著 iframe 一起長高。 -->
<style>html.dt-measure, html.dt-measure body { height:auto !important; min-height:0 !important; }</style>
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var b = document.body;
    root.classList.add("dt-measure");
    var cs = getComputedStyle(b), pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    var inner = b.getBoundingClientRect().height - pt - pb;
    root.classList.remove("dt-measure");
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（原本的 padding 比較大就用原本的）
    var h = Math.ceil(inner + Math.max(room, pt) + Math.max(room, pb));
    if (!(inner > 40) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>

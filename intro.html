<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁一句話定位</title>
<!--
  官網首頁 ②「一句話定位」（2026/10/15 製作）
  - 官網內頁原頁開啟（target=_top）；外站另開分頁
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/intro.html" width="100%" height="460" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --ink:#0F0E0E; --muted:#5C5552; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; }
  .w { max-width:900px; padding:0 24px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--cobalt); }
  h1 { font:900 46px/1.25 "Noto Sans TC",sans-serif; margin:16px 0 18px; }
  p { font:500 18px/1.75 "Noto Sans TC",sans-serif; color:var(--muted); max-width:720px; margin:0 auto; }
  .row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
  a { display:inline-flex; align-items:center; font:700 16px/1 "Noto Sans TC",sans-serif; padding:15px 24px; border-radius:999px; text-decoration:none; transition:transform .2s; }
  a:hover { transform:translateY(-2px); }
  .cob { background:var(--cobalt); color:#fff; }
  .ghost { border:2px solid var(--ink); color:var(--ink); padding:13px 22px; }
  @media (max-width: 760px) { h1 { font-size:34px; } p { font-size:16px; } }
  @media (max-width: 480px) {
    .w { padding:0 16px; }
    h1 { font-size:26px; margin:12px 0 12px; }
    p { font-size:14.5px; line-height:1.7; }
    .row { margin-top:20px; gap:10px; }
    a { font-size:15px; padding:13px 18px; }
    .ghost { padding:11px 16px; }
  }
</style>
</head>
<body>
<div class="w">
  <div class="k">DESIGN THINKING POW WOW</div>
  <h1>用設計思考，<br>帶團隊從問題走到原型</h1>
  <p>我們為企業、學校與公部門規劃設計思考與創意思考工作坊。不講空泛的理論，整天動手做：訪談、定義問題、發想、做原型、測試，下課時團隊手上就有能拿去試的東西。</p>
  <div class="row">
    <a class="cob" target="_top" href="https://www.designthinking.com.tw/contactus">企業工作坊洽詢 →</a>
    <a class="ghost" target="_blank" rel="noopener" data-course="home-intro" href="https://www.pressplay.cc/link/s/DE956453?utm_content=home-intro">自己學：線上課程</a>
  </div>
</div>
<script>
  // 課程連結只改這一行（之後換「第一門課_官網頁面」短網址時用）
  var COURSE_URL = "https://www.pressplay.cc/link/s/DE956453";
  // 11/01 00:00（台北）前：連到 LINE 官方帳號、按鈕字換成 LINE 版（10/20）；之後自動回到 PressPlay 原本的連結與文字。預覽：?date=2026-11-02
  var EP00_URL = "https://youtu.be/UnSkHuQmk7o";   // 10/27：LINE 換成 EP00
  var today = new URLSearchParams(location.search).get("date") || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  var live = today >= "2026-11-01";
  document.querySelectorAll("a[data-course]").forEach(function (a) {
    if (live) { a.href = COURSE_URL + (COURSE_URL.indexOf("?") < 0 ? "?" : "&") + "utm_content=" + a.getAttribute("data-course"); return; }
    a.href = EP00_URL;
    a.textContent = "線上課程：免費看 5 分鐘介紹 →";
  });
</script>
<!-- 課程點擊追蹤（2026/10/17；10/20 加 LINE；10/27 加 EP00 送 ep00_click、小測驗送 quiz_click）：點到 PressPlay 連結送 pressplay_click、點到 LINE（lin.ee）送 line_click，每次點擊只送一個事件到官網 GA4。
     不載入 gtag.js（避免 GA 自動記錄捲動、瀏覽，灌水官網流量）；不含個人資料。測試時網址加 ?ga=off 可關閉。 -->
<script>
(function () {
  var SITE_GA4_ID = "G-Y0VX6H9PVX";   // 官網 GA4（DT POW WOW - GA4-New）；空字串＝關閉
  var WIDGET = "home-intro";
  var qs = new URLSearchParams(location.search);
  if (!SITE_GA4_ID || qs.get("ga") === "off") return;
  function cid() {
    var id = "";
    try { id = localStorage.getItem("dt_pp_cid") || ""; } catch (e) {}
    if (!id) { id = Math.floor(Math.random() * 2147483647) + "." + Math.floor(Date.now() / 1000); try { localStorage.setItem("dt_pp_cid", id); } catch (e) {} }
    return id;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href*='pressplay'], a[href*='lin.ee'], a[href*='youtu'], a[href*='playground']") : null;
    if (!a) return;
    var now = Math.floor(Date.now() / 1000);
    var p = new URLSearchParams({ v: "2", tid: SITE_GA4_ID, cid: cid(), sid: String(now), sct: "1", seg: "1", _et: "1",
      en: /lin\.ee/.test(a.href) ? "line_click" : /youtu/.test(a.href) ? "ep00_click" : /playground/.test(a.href) ? "quiz_click" : "pressplay_click", dl: location.href.slice(0, 300), dr: document.referrer.slice(0, 300),
      "ep.widget": WIDGET, "ep.link_url": a.href.slice(0, 100), "ep.parent_page": (qs.get("post") || document.referrer || "").slice(0, 100) });
    var u = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (!(navigator.sendBeacon && navigator.sendBeacon(u))) { var i = new Image(); i.src = u; }
  }, true);
})();
</script>
</body>
</html>

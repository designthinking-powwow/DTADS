<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁一句話定位</title>
<!--
  官網首頁 ②「一句話定位」（2026/10/15 製作）
  - 官網內頁原頁開啟（target=_top）；外站另開分頁
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/intro.html" width="100%" height="400" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --cobalt:#1F4BFF; --ink:#0F0E0E; --muted:#5C5552; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; color:var(--ink); overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; }
  .w { max-width:900px; padding:0 24px; }
  .k { font:800 13px/1 Inter,sans-serif; letter-spacing:.16em; color:var(--cobalt); }
  h1 { font:900 46px/1.25 "Noto Sans TC",sans-serif; margin:16px 0 18px; }
  p { font:500 18px/1.75 "Noto Sans TC",sans-serif; color:var(--muted); max-width:720px; margin:0 auto; }
  .row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
  a { display:inline-flex; align-items:center; font:700 16px/1 "Noto Sans TC",sans-serif; padding:15px 24px; border-radius:999px; text-decoration:none; transition:transform .2s; }
  a:hover { transform:translateY(-2px); }
  .cob { background:var(--cobalt); color:#fff; }
  .ghost { border:2px solid var(--ink); color:var(--ink); padding:13px 22px; }
  @media (max-width: 760px) { h1 { font-size:34px; } p { font-size:16px; } }
  @media (max-width: 480px) {
    .w { padding:0 16px; }
    h1 { font-size:26px; margin:12px 0 12px; }
    p { font-size:14.5px; line-height:1.7; }
    .row { margin-top:20px; gap:10px; }
    a { font-size:15px; padding:13px 18px; }
    .ghost { padding:11px 16px; }
  }
</style>
</head>
<body>
<div class="w">
  <div class="k">DESIGN THINKING POW WOW</div>
  <h1>用設計思考，<br>帶團隊從問題走到原型</h1>
  <p>我們為企業、學校與公部門規劃設計思考與創意思考工作坊。不講空泛的理論，整天動手做：訪談、定義問題、發想、做原型、測試，下課時團隊手上就有能拿去試的東西。</p>
  <div class="row">
    <a class="cob" target="_top" href="https://www.designthinking.com.tw/contactus">企業工作坊洽詢 →</a>
    <a class="ghost" target="_blank" rel="noopener" href="https://www.pressplay.cc/link/s/DE956453?utm_content=home-intro">自己學：線上課程</a>
  </div>
</div>
</body>
</html>

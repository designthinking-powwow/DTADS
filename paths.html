<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁三條路</title>
<!--
  官網首頁 ③「三條路」（2026/10/15 製作）：帶團隊一起學／自己按自己的節奏學／先免費聽、免費讀
  - 官網內頁原頁開啟（target=_top）；外站另開分頁
  - Kolable 嵌入碼：<iframe src="https://designthinking-powwow.github.io/DTADS/paths.html" width="100%" height="420" style="border:0;" frameborder="0" scrolling="no"></iframe>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --coral:#FF3B5C; --violet:#7B2FF7; --ink:#0F0E0E; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#fff; }
  body { font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif; overflow:hidden; display:flex; align-items:center; }
  a { text-decoration:none; }
  .paths { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:1120px; width:100%; margin:0 auto; padding:0 48px; }
  .p { border-radius:18px; padding:26px 26px 24px; color:#fff; display:flex; flex-direction:column; min-height:230px; transition:transform .25s; }
  .p:hover { transform:translateY(-4px); }
  .k { font:800 12px/1 Inter,sans-serif; letter-spacing:.16em; opacity:.85; }
  h3 { font:900 25px/1.3 "Noto Sans TC",sans-serif; margin:14px 0 8px; }
  p { font:500 15px/1.6 "Noto Sans TC",sans-serif; opacity:.92; flex:1; }
  .go { font:700 15px "Noto Sans TC",sans-serif; margin-top:16px; }
  .p1 { background:var(--ink); } .p2 { background:var(--coral); color:var(--ink); } .p3 { background:var(--violet); }
  @media (max-width: 760px) {
    .paths { grid-template-columns:1fr; gap:10px; padding:0 16px; }
    .p { min-height:0; padding:12px 16px; display:grid; grid-template-columns:1fr auto; grid-template-areas:"k go" "h go" "t go"; column-gap:12px; align-items:center; }
    .k { grid-area:k; font-size:10px; }
    h3 { grid-area:h; font-size:17px; margin:4px 0 2px; }
    p { grid-area:t; font-size:12.5px; line-height:1.4; }
    .go { grid-area:go; margin:0; font-size:22px; }
    .go span { display:none; }
  }
</style>
</head>
<body>
<div class="paths">
  <a class="p p1" target="_top" href="https://www.designthinking.com.tw/contactus"><span class="k">FOR TEAMS</span><h3>帶團隊一起學</h3><p>企業內訓、學校與公部門工作坊，依你們的題目量身規劃。</p><span class="go"><span>聊聊你們的題目 </span>→</span></a>
  <a class="p p2" target="_blank" rel="noopener" data-course="home-paths" href="https://www.pressplay.cc/link/s/DE956453?utm_content=home-paths"><span class="k">ON YOUR OWN</span><h3>自己按自己的節奏學</h3><p>線上課程，錄影課＋學習單，在 PressPlay 隨時開始。</p><span class="go"><span>看線上課程 </span>→</span></a>
  <a class="p p3" target="_blank" rel="noopener" href="https://chachacreative101.substack.com/subscribe"><span class="k">FREE</span><h3>先免費聽、免費讀</h3><p>每週三的 Podcast 和《未來思考週報》，換個角度想問題。</p><span class="go"><span>免費訂閱週報 </span>→</span></a>
</div>
<script>
  // 課程連結只改這一行（之後換「第一門課_官網頁面」短網址時用）
  var COURSE_URL = "https://www.pressplay.cc/link/s/DE956453";
  // 11/01 12:00（台北，PressPlay 中午開賣）前：連到 LINE 官方帳號、按鈕字換成 LINE 版（10/20）；之後自動回到 PressPlay 原本的連結與文字。預覽：?date=2026-11-02
  var EP00_URL = "https://youtu.be/UnSkHuQmk7o";   // 10/27：LINE 換成 EP00
  var today = new URLSearchParams(location.search).get("date") || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  var live = (new URLSearchParams(location.search).get("date") ? today >= "2026-11-01" : Date.now() >= Date.parse("2026-11-01T12:00:00+08:00"));
  document.querySelectorAll("a[data-course]").forEach(function (a) {
    if (live) { a.href = COURSE_URL + (COURSE_URL.indexOf("?") < 0 ? "?" : "&") + "utm_content=" + a.getAttribute("data-course"); return; }
    a.href = EP00_URL;
    var go = a.querySelector(".go span");
    if (go) go.textContent = "免費看 5 分鐘課程介紹 ";
    var p = a.querySelector("p");
    if (p) p.textContent = "線上課程 11/01（日）中午在 PressPlay 開賣，先免費看 5 分鐘課程介紹。";
  });
</script>
<!-- 課程點擊追蹤（2026/10/17；10/20 加 LINE；10/27 加 EP00 送 ep00_click、小測驗送 quiz_click）：點到 PressPlay 連結送 pressplay_click、點到 LINE（lin.ee）送 line_click，每次點擊只送一個事件到官網 GA4。
     不載入 gtag.js（避免 GA 自動記錄捲動、瀏覽，灌水官網流量）；不含個人資料。測試時網址加 ?ga=off 可關閉。 -->
<script>
(function () {
  var SITE_GA4_ID = "G-Y0VX6H9PVX";   // 官網 GA4（DT POW WOW - GA4-New）；空字串＝關閉
  var WIDGET = "home-paths";
  var qs = new URLSearchParams(location.search);
  if (!SITE_GA4_ID || qs.get("ga") === "off") return;
  function cid() {
    var id = "";
    try { id = localStorage.getItem("dt_pp_cid") || ""; } catch (e) {}
    if (!id) { id = Math.floor(Math.random() * 2147483647) + "." + Math.floor(Date.now() / 1000); try { localStorage.setItem("dt_pp_cid", id); } catch (e) {} }
    return id;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href*='pressplay'], a[href*='lin.ee'], a[href*='youtu'], a[href*='playground']") : null;
    if (!a) return;
    var now = Math.floor(Date.now() / 1000);
    var p = new URLSearchParams({ v: "2", tid: SITE_GA4_ID, cid: cid(), sid: String(now), sct: "1", seg: "1", _et: "1",
      en: /lin\.ee/.test(a.href) ? "line_click" : /youtu/.test(a.href) ? "ep00_click" : /playground/.test(a.href) ? "quiz_click" : "pressplay_click", dl: location.href.slice(0, 300), dr: document.referrer.slice(0, 300),
      "ep.widget": WIDGET, "ep.link_url": a.href.slice(0, 100), "ep.parent_page": (qs.get("post") || document.referrer || "").slice(0, 100) });
    var u = "https://www.google-analytics.com/g/collect?" + p.toString();
    if (!(navigator.sendBeacon && navigator.sendBeacon(u))) { var i = new Image(); i.src = u; }
  }, true);
})();
</script>
<!-- 10/27 UI/UX：把內容的實際高度傳給官網，官網（GTM「內嵌區塊自動高度」）把這個區塊調成剛好的高度，拿掉上下大片空白。官網沒有接收時，照舊用嵌入碼的固定高度。
     量高度時先暫時把 html／body 的 100% 高度拿掉，量到的是「內容本身」的高度，不會跟著 iframe 一起長高。 -->
<style>html.dt-measure, html.dt-measure body { height:auto !important; min-height:0 !important; }</style>
<script>
(function () {
  if (window.parent === window) return;
  var last = 0, root = document.documentElement;
  function measure() {
    var b = document.body;
    root.classList.add("dt-measure");
    var cs = getComputedStyle(b), pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    var inner = b.getBoundingClientRect().height - pt - pb;
    root.classList.remove("dt-measure");
    var room = window.innerWidth < 700 ? 48 : 72;   // 上下各留的空間（原本的 padding 比較大就用原本的）
    var h = Math.ceil(inner + Math.max(room, pt) + Math.max(room, pb));
    if (!(inner > 40) || Math.abs(h - last) < 2) return;
    last = h;
    parent.postMessage({ dtadsHeight: h }, "*");
  }
  window.addEventListener("load", measure);
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  setTimeout(measure, 800); setTimeout(measure, 2500);
})();
</script>
</body>
</html>
